GOOSE_PROVIDER: openai
GOOSE_MODEL: myopencode/glm-5.2
GOOSE_MODE: smart_approve
openai:
  OPENAI_API_KEY: ${FORGE_AGENT_API_KEY}
  OPENAI_HOST: ${FORGE_AGENT_HOST}
  OPENAI_BASE_PATH: chat/completions

extensions:
  faucet-db:
    type: stdio
    cmd: "${FORGE_ROOT}/bin/faucet/faucet.exe"
    args: ["mcp", "--data-dir", "${FORGE_ROOT}/data/faucet"]
    envs:
      FORGE_ROOT: "${FORGE_ROOT}"
  browser:
    type: stdio
    cmd: "${NODE_DIR}/node.exe"
    args: ["${FORGE_ROOT}/bin/pw-mcp/node_modules/@playwright/mcp/cli.js", "--browser", "msedge", "--user-data-dir", "${FORGE_ROOT}/data/pw-profile"]
    envs:
      NO_PROXY: "127.0.0.1,localhost"
