# 由启动器生成（C:/ZCodeWorks/PocketForge/forge 占位）——goose 不会展开 ${VAR}，必须写入绝对路径
GOOSE_PROVIDER: openai
GOOSE_MODEL: myopencode/glm-5.2
GOOSE_MODE: smart_approve

extensions:
  faucet-db:
    type: stdio
    name: faucet-db
    enabled: true
    cmd: 'C:/ZCodeWorks/PocketForge/forge/bin/faucet/faucet.exe'
    args: ['mcp', '--data-dir', 'C:/ZCodeWorks/PocketForge/forge/data/faucet']
    timeout: 300
  browser:
    type: stdio
    name: browser
    enabled: true
    cmd: 'C:/ZCodeWorks/PocketForge/forge/bin/node-v22/node-v22.21.1-win-x64/node.exe'
    args: ['C:/ZCodeWorks/PocketForge/forge/bin/pw-mcp/node_modules/@playwright/mcp/cli.js', '--browser', 'msedge', '--user-data-dir', 'C:/ZCodeWorks/PocketForge/forge/data/pw-profile', '--allowed-origins', '*']
    timeout: 300
  chatrecall:
    type: platform
    name: chatrecall
    enabled: true
  memory:
    type: stdio
    name: memory
    enabled: true
    cmd: 'cmd'
    args: ['/c', 'C:/ZCodeWorks/PocketForge/forge/bin/memory-mcp.cmd']
    timeout: 120
  mcp-sequential-thinking:
    type: stdio
    name: mcp-sequential-thinking
    enabled: true
    cmd: 'C:/ZCodeWorks/PocketForge/forge/bin/node-v22/node-v22.21.1-win-x64/node.exe'
    args: ['C:/ZCodeWorks/PocketForge/forge/bin/vendor/mcp-sequential-thinking/node_modules/@modelcontextprotocol/server-sequential-thinking/dist/index.js']
    timeout: 300

  mcp-fetch:
    type: stdio
    name: mcp-fetch
    enabled: true
    cmd: 'C:/ZCodeWorks/PocketForge/forge/bin/node-v22/node-v22.21.1-win-x64/node.exe'
    args: ['C:/ZCodeWorks/PocketForge/forge/bin/vendor/mcp-fetch/node_modules/fetch-mcp/cli.js']
    timeout: 300
