# 由启动器生成（C:/ZCodeWorks/PocketForge/forge 占位）——goose 不会展开 ${VAR}，必须写入绝对路径
GOOSE_PROVIDER: openai
# 种子=池首模型（deepseek 官方故障期出厂默认换 mimo-v2.5，v4.1-flash 留池可切回——2026-09-15）
GOOSE_MODEL: mimo-v2.5
GOOSE_MODE: smart_approve
# T1（裁决书 S-B）：hints 只认 .goosehints，不再吸入 AGENTS.md（dev 仓库工作契约/用户域文件泄漏面）
CONTEXT_FILE_NAMES: ['.goosehints']

extensions:
  faucet-db:
    type: stdio
    name: faucet-db
    enabled: true
    cmd: 'C:/ZCodeWorks/PocketForge/forge/bin/faucet/faucet.exe'
    args: ['mcp', '--data-dir', 'C:/ZCodeWorks/PocketForge/forge/data/faucet']
    timeout: 300
  browser:
    type: stdio
    name: browser
    enabled: true
    cmd: 'C:/ZCodeWorks/PocketForge/forge/bin/node-v22/node-v22.21.1-win-x64/node.exe'
    args: ['C:/ZCodeWorks/PocketForge/forge/bin/pw-mcp/node_modules/@playwright/mcp/cli.js', '--browser', 'msedge', '--user-data-dir', 'C:/ZCodeWorks/PocketForge/forge/data/pw-profile', '--allowed-origins', '*']
    timeout: 300
  chatrecall:
    type: platform
    name: chatrecall
    enabled: true
  memory:
    type: stdio
    name: memory
    enabled: true
    cmd: 'cmd'
    args: ['/c', 'C:/ZCodeWorks/PocketForge/forge/bin/memory-mcp.cmd']
    timeout: 120
  # G3（裁决书 S-B）：关停无场景点名的平台扩展——已双臂探针实证（tmp/goose-probe/ext-probe.js）：
  # apps/summon/extensionmanager/analyze 共 11 把工具消失，其余扩展不受影响。
  # todo 保留（ACP plan 事件来源，P32 底座）。用户在设置面板改过开关的，bootstrap 重建时保留其值。
  apps:
    type: platform
    name: apps
    enabled: false
  summon:
    type: platform
    name: summon
    enabled: false
  extensionmanager:
    type: platform
    name: extensionmanager
    enabled: false
  analyze:
    type: platform
    name: analyze
    enabled: false
  mcp-fetch:
    type: stdio
    name: mcp-fetch
    enabled: true
    cmd: 'C:/ZCodeWorks/PocketForge/forge/bin/node-v22/node-v22.21.1-win-x64/node.exe'
    args: ['C:/ZCodeWorks/PocketForge/forge/bin/vendor/mcp-fetch/node_modules/fetch-mcp/cli.js']
    timeout: 300
