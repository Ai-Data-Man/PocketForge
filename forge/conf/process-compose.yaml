version: '0.5'
log_location: '${FORGE_ROOT}/data/logs/pc.log'
log_configuration:
  rotation:
    max_size_mb: 10
    max_backups: 3
    compress: true

processes:
  nats:
    command: '${FORGE_ROOT}/bin/nats-server/nats-server-v2.14.5-windows-amd64/nats-server.exe -a 127.0.0.1 -p 4222 -m 8222 -js -sd ${FORGE_ROOT}/data/js'
    is_daemon: true
    availability:
      restart: 'on_failure'
    readiness_probe:
      exec:
        command: '${FORGE_ROOT}/bin/nats-cli/nats-0.4.0-windows-amd64/nats.exe -s 127.0.0.1:4222 server check jetstream'
      period_seconds: 5
      failure_threshold: 12

  faucet:
    command: '${FORGE_ROOT}/bin/faucet/faucet.exe serve --foreground --host 127.0.0.1 --port ${FAUCET_PORT} --data-dir ${FORGE_ROOT}/data/faucet'
    is_daemon: true
    availability:
      restart: 'on_failure'
    readiness_probe:
      # s90: 探针 http_get→TCP（复用 pg-probe 同款，传 faucet.port 文件）——HTTP /healthz 每 5s 一探=faucet
      # 记一行 access 日志，黑窗口被探活噪音刷屏（用户实录 2026-09-15）；TCP 裸连接实测零日志（27→27 行）
      exec:
        command: '${FORGE_ROOT}/bin/node-v22/node-v22.21.1-win-x64/node.exe ${FORGE_ROOT}/bin/pg-probe.js ${FORGE_ROOT}/data/faucet.port'
      period_seconds: 5
      failure_threshold: 12

  goose-scheduler:
    # goose v1.50 适配（research/23）：acp 对 stdin EOF 即优雅退出，pc 守护无 stdin → 须 wrapper 持管道（bin/goose-scheduler.js，bootstrap 5g 物化）
    command: '${FORGE_ROOT}/bin/node-v22/node-v22.21.1-win-x64/node.exe ${FORGE_ROOT}/bin/goose-scheduler.js'
    environment:
      - 'GOOSE_PATH_ROOT=${FORGE_ROOT}/conf/goose'
      - 'GOOSE_DISABLE_KEYRING=1'
      - 'GOOSE_TELEMETRY_ENABLED=false'
    is_daemon: true
    availability:
      restart: 'on_failure'
    depends_on:
      faucet:
        condition: process_healthy

  faucet-rawsql:
    command: '${FORGE_ROOT}/bin/node-v22/node-v22.21.1-win-x64/node.exe ${FORGE_ROOT}/bin/faucet-rawsql.js ${FORGE_ROOT}/data/faucet/faucet.db'
    is_daemon: false
    availability:
      restart: 'no'
    depends_on:
      faucet:
        condition: process_healthy

  # s94 F-6: 首启 faucet 供给（admin/forge-admin 角色/agent key → data/faucet/.apikey；幂等，脚本内自跳过；
  # 供给挂栈内因 faucet 端口就绪是前置条件——bootstrap 先于栈起等不到端口；失败=脚本 warn+exit 0 不阻断）
  faucet-provision:
    command: '${FORGE_ROOT}/bin/node-v22/node-v22.21.1-win-x64/node.exe ${FORGE_ROOT}/bin/faucet-provision.js'
    is_daemon: false
    availability:
      restart: 'no'
    depends_on:
      faucet:
        condition: process_healthy

  daily-backup:
    command: '${FORGE_ROOT}/bin/node-v22/node-v22.21.1-win-x64/node.exe ${FORGE_ROOT}/bin/forge-backup.js ${FORGE_ROOT} 7'
    is_daemon: false
    availability:
      restart: 'no'
    log_location: '${FORGE_ROOT}/data/logs/backup.log'
    depends_on:
      faucet-rawsql:
        condition: process_completed_successfully

  # s66/ADR-0011 阶段一：便携 PG（zonky 17.11.0）。数据目录 data/pg（首启由 pg-init 现场初始化，
  # 删 data/pg=重置）；端口 data/pg.port（${PG_PORT} 由启动器导出，pc 从环境展开）。
  # 失败面：阶段一全仓零消费者——pg 失败仅本面板红，栈照常绿（无任何 depends_on 指向 pg/pg-init）。
  # pc v1.122.0 schema 实证（2026-09-05，本开发机）：restart on_failure 支持 max_restarts（0=无限，N=封顶 N 次）
  # 与 backoff_seconds；无 max_retries 字段（yaml 解析非严格，拼错字段被静默忽略——dry-run 阴性对照证实，
  # 源码 src/types/process.go RestartPolicyConfig）；行为实测 max_restarts:2+backoff:3 → 重启止于 2 次后项目退出。
  # EDR 硬拦时无上限重启=白烧 CPU，故封顶 3 次；阶段二随首个消费者复核翻转。
  pg-init:
    command: 'cmd /c ${FORGE_ROOT}/bin/pg-init.cmd'
    is_daemon: false
    availability:
      restart: 'no'

  pg:
    command: '${FORGE_ROOT}/bin/pg/bin/postgres.exe -D ${FORGE_ROOT}/data/pg -p ${PG_PORT} -c listen_addresses=127.0.0.1 -c max_connections=20'
    is_daemon: true
    availability:
      restart: 'on_failure'
      max_restarts: 3
      backoff_seconds: 5
    log_location: '${FORGE_ROOT}/data/logs/pg.log'
    readiness_probe:
      exec:
        # s66 阶段二：TCP 探活替代 pg_ctl status（后者探 data 目录全局态，托管进程死亡而孤儿占目录时假阳性；
        # 端口可连接=消费方真实契约）。net.connect 探 data/pg.port，2s 超时，连通 0/否则 1。
        # 内联 node -e 会遭 Go->cmd->argv 三层引号转义破坏（实证见 tmp/s66-readiness-tcp-experiment.log），故落文件。
        command: '${FORGE_ROOT}/bin/node-v22/node-v22.21.1-win-x64/node.exe ${FORGE_ROOT}/bin/pg-probe.js ${FORGE_ROOT}/data/pg.port'
      period_seconds: 5
      failure_threshold: 12
    depends_on:
      pg-init:
        condition: process_completed_successfully

  chat-bridge:
    command: '${FORGE_ROOT}/bin/node-v22/node-v22.21.1-win-x64/node.exe ${FORGE_ROOT}/bin/chat-bridge.js'
    environment:
      - 'FORGE_ROOT=${FORGE_ROOT}'
      - 'PORT=8790'
      - 'GOOSE_PROVIDER=openai'
      - 'GOOSE_MODEL=${GOOSE_MODEL_NAME}'
      - 'OPENAI_API_KEY=${FORGE_AGENT_API_KEY}'
      - 'OPENAI_HOST=${FORGE_AGENT_HOST}'
      - 'OPENAI_BASE_PATH=chat/completions'
      - 'NO_PROXY=127.0.0.1,localhost'
    is_daemon: true
    availability:
      restart: 'on_failure'
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 8790
        scheme: http
        path: /healthz
      period_seconds: 5
      failure_threshold: 12
