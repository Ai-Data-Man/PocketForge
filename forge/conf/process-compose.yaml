version: '0.5'
log_location: '${FORGE_ROOT}/data/logs/pc.log'
log_configuration:
  rotation:
    max_size_mb: 10
    max_backups: 3
    compress: true

processes:
  nats:
    command: '${FORGE_ROOT}/bin/nats-server/nats-server-v2.14.5-windows-amd64/nats-server.exe -a 127.0.0.1 -p 4222 -m 8222 -js -sd ${FORGE_ROOT}/data/js'
    is_daemon: true
    availability:
      restart: 'on_failure'
    readiness_probe:
      exec:
        command: '${FORGE_ROOT}/bin/nats-cli/nats-0.4.0-windows-amd64/nats.exe -s 127.0.0.1:4222 server check jetstream'
      period_seconds: 5
      failure_threshold: 12

  faucet:
    command: '${FORGE_ROOT}/bin/faucet/faucet.exe serve --foreground --host 127.0.0.1 --port ${FAUCET_PORT} --data-dir ${FORGE_ROOT}/data/faucet'
    is_daemon: true
    availability:
      restart: 'on_failure'
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: ${FAUCET_PORT}
        scheme: http
        path: /healthz
      period_seconds: 5
      failure_threshold: 12

  goose-scheduler:
    command: '${FORGE_ROOT}/bin/goose/goose-package/goose.exe acp --enable-scheduler'
    environment:
      - 'GOOSE_PATH_ROOT=${FORGE_ROOT}/conf/goose'
      - 'GOOSE_DISABLE_KEYRING=1'
      - 'GOOSE_TELEMETRY_ENABLED=false'
    is_daemon: true
    availability:
      restart: 'on_failure'
    depends_on:
      faucet:
        condition: process_healthy

  faucet-rawsql:
    command: '${FORGE_ROOT}/bin/node-v22/node-v22.21.1-win-x64/node.exe ${FORGE_ROOT}/bin/faucet-rawsql.js ${FORGE_ROOT}/data/faucet/faucet.db'
    is_daemon: false
    availability:
      restart: 'no'
    depends_on:
      faucet:
        condition: process_healthy

  daily-backup:
    command: '${FORGE_ROOT}/bin/node-v22/node-v22.21.1-win-x64/node.exe ${FORGE_ROOT}/bin/forge-backup.js ${FORGE_ROOT} 7'
    is_daemon: false
    availability:
      restart: 'no'
    log_location: '${FORGE_ROOT}/data/logs/backup.log'
    depends_on:
      faucet-rawsql:
        condition: process_completed_successfully

  chat-bridge:
    command: '${FORGE_ROOT}/bin/node-v22/node-v22.21.1-win-x64/node.exe ${FORGE_ROOT}/bin/chat-bridge.js'
    environment:
      - 'FORGE_ROOT=${FORGE_ROOT}'
      - 'PORT=8790'
      - 'GOOSE_MODE=auto'
      - 'GOOSE_PROVIDER=openai'
      - 'GOOSE_MODEL=${GOOSE_MODEL_NAME}'
      - 'OPENAI_API_KEY=${FORGE_AGENT_API_KEY}'
      - 'OPENAI_HOST=${FORGE_AGENT_HOST}'
      - 'OPENAI_BASE_PATH=chat/completions'
      - 'NO_PROXY=127.0.0.1,localhost'
    is_daemon: true
    availability:
      restart: 'on_failure'
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 8790
        scheme: http
        path: /healthz
      period_seconds: 5
      failure_threshold: 12
