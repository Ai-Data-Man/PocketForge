<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小 forge · 数字员工</title>
<style>
*{box-sizing:border-box}
:root{--g:#0b6b3a;--g2:#0e8749;--bg:#f2f5f3;--line:#dde8e1;--tx:#1a2a1a;--mut:#6a7a70}
body{font-family:"Microsoft YaHei",system-ui,sans-serif;margin:0;background:var(--bg);color:var(--tx);height:100vh;display:flex;overflow:hidden}
/* sidebar */
#side{width:250px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;transition:margin .2s}
#side.hidden{margin-left:-250px}
#side header{padding:14px 14px 8px;font-weight:bold;font-size:16px;display:flex;align-items:center;gap:8px}
#newchat{margin:4px 14px 10px;padding:9px;background:var(--g);color:#fff;border:none;border-radius:9px;cursor:pointer;font-size:14px;font-family:inherit}
#sessions{flex:0 1 auto;overflow-y:auto;padding:0 8px 8px;max-height:42%}
#filetree{min-height:60px;overflow-y:auto;padding:0 8px}
.ftree{padding:5px 6px;border-radius:7px;font-size:12.5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.ftree:hover{background:#f0f5f2}
.ftree .ico{width:16px;text-align:center}
.ftree .sz{color:var(--mut);font-size:10.5px;margin-left:auto}
.sitem{padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;line-height:1.4;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sitem:hover{background:#f0f5f2}
.sitem.active{background:#e2efe7;font-weight:bold}
.sitem .t{color:var(--mut);font-size:11px;font-weight:normal}
.sdel{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:none;color:#b66;cursor:pointer;font-size:12px;display:none}
.sitem{position:relative}
.sitem:hover .sdel{display:block}
#side footer{border-top:1px solid var(--line);padding:8px 14px;display:flex;gap:8px}
.icobtn{background:none;border:none;cursor:pointer;font-size:15px;padding:6px;border-radius:7px}
.icobtn:hover{background:#f0f5f2}
/* main */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{background:#fff;border-bottom:1px solid var(--line);padding:9px 14px;display:flex;align-items:center;gap:10px;font-size:14px}
#burger{background:none;border:none;font-size:18px;cursor:pointer}
#mode{padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-family:inherit;font-size:13px;cursor:pointer}
#model-label{color:var(--mut);font-size:12px;margin-left:auto}
#model-pick{position:relative;cursor:pointer;padding:5px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px;user-select:none;max-width:230px}
#model-cur{display:inline-block;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
#model-pick:hover{border-color:var(--g)}
#model-drop{display:none;position:absolute;top:110%;left:0;z-index:30;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.12);width:300px}
#model-pick.open #model-drop{display:block}
#model-search{width:100%;box-sizing:border-box;border:none;border-bottom:1px solid var(--line);padding:9px 12px;border-radius:10px 10px 0 0;outline:none;font-size:13px;font-family:inherit}
#model-items{max-height:280px;overflow-y:auto}
#model-items .mi{padding:8px 12px;font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#model-items .mi:hover{background:#f0f5f2}
#model-items .mi.cur{background:#e2efe7;font-weight:bold}
.model-note{padding:6px 12px;font-size:11px;color:var(--mut)}
/* chat */
#chat{flex:1;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:11px 15px;border-radius:13px;font-size:15.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--g);color:#fff;border-bottom-right-radius:4px}
.msg.agent{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.card{align-self:flex-start;width:80%;background:#fff;border:1px dashed #c4d6cb;border-radius:11px;font-size:13px;overflow:hidden}
.card summary{padding:8px 13px;cursor:pointer;color:#3a5a4a;user-select:none;list-style:none;display:flex;gap:8px;align-items:center}
.card summary::before{content:'🔧'}
.card[open] summary{border-bottom:1px solid var(--line)}
.card .body{padding:10px 13px;white-space:pre-wrap;font-family:Consolas,monospace;font-size:12px;color:#445;max-height:260px;overflow:auto;background:#fafcfb}
.card .st{margin-left:auto;font-size:11px;color:var(--mut)}
.st.done{color:var(--g);font-weight:bold}
.st.err{color:#b00020;font-weight:bold}
.typing{align-self:flex-start;color:var(--mut);font-size:13px;padding:2px 15px}
/* input */
#inputbar{display:flex;gap:9px;padding:13px 18px;background:#fff;border-top:1px solid var(--line)}
#txt{flex:1;font-size:16px;padding:11px 13px;border:2px solid var(--line);border-radius:11px;outline:none;font-family:inherit}
#txt:focus{border-color:var(--g)}
#send{font-size:16px;padding:11px 22px;background:var(--g);color:#fff;border:none;border-radius:11px;cursor:pointer}
#send:disabled{background:#9db8ac}
#stop{font-size:14px;padding:11px 16px;background:#b00020;color:#fff;border:none;border-radius:11px;cursor:pointer;display:none}
/* settings modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:9}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:9}
.modal-bg.on{display:flex}
.panel-box{background:#fff;border-radius:14px;width:520px;max-height:86vh;overflow-y:auto;padding:20px 22px}
.skill{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:10px}
.skill .nm{font-weight:bold;font-size:14px}
.skill .ds{font-size:12.5px;color:var(--mut);margin:4px 0 8px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.skill .ops{display:flex;gap:8px}
.skill pre{background:#fafcfb;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:11.5px;max-height:220px;overflow:auto;white-space:pre-wrap;margin:8px 0 0}
#modal.on{display:flex}
#panel{background:#fff;border-radius:14px;width:430px;max-height:80vh;overflow-y:auto;padding:20px 22px}
#panel h3{margin:0 0 12px;font-size:17px}
.frow{margin-bottom:14px}
.frow label{display:block;font-size:13px;color:var(--mut);margin-bottom:5px}
.frow input,.frow select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit}
.fnote{font-size:12px;color:var(--mut);margin-top:4px}
.mini{padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:13px;font-family:inherit}
.prov{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;font-size:13px}
.prov.active{border-color:var(--g);background:#eaf4ee}
.prov .nm{font-weight:bold}
.prov .hd{color:var(--mut);font-size:11px;flex:1}
.mpick{display:block;font-size:13px;padding:4px 2px;cursor:pointer}
.prov button{border:none;background:none;cursor:pointer;font-size:13px}
#save-cfg{width:100%;padding:11px;background:var(--g);color:#fff;border:none;border-radius:9px;font-size:15px;cursor:pointer;margin-top:6px}
.mbar{margin-top:8px;display:flex;gap:6px;opacity:0;transition:opacity .15s}
.msg:hover .mbar{opacity:1}
.msgbtn{border:none;background:rgba(11,107,58,.08);color:#0b6b3a;border-radius:6px;font-size:11px;padding:3px 10px;cursor:pointer}
.msg.user .msgbtn{background:rgba(255,255,255,.25);color:#fff}
.msg.info{background:#eef6f1;border-color:#cfe4d8;color:#2a4a3a;font-size:13.5px}
.mdtab{border-collapse:collapse;margin:6px 0;font-size:13.5px}
.mdtab th,.mdtab td{border:1px solid #d5e2da;padding:4px 10px}
.mdtab th{background:#eef5f0}
.mdcode{background:#f6f8f6;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:Consolas,monospace;font-size:12px;overflow-x:auto;white-space:pre-wrap;margin:6px 0}
.msg.agent code{background:#eef3ef;border-radius:4px;padding:1px 5px;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:#ff6b6b;display:inline-block}
.dot.ok{background:#7dff9e}
</style>
</head>
<body>
<div id="side">
  <header><span class="dot" id="status"></span>小 forge</header>
  <button id="newchat">＋ 新对话</button>
  <div id="side-label-sess" style="padding:2px 14px;font-size:11px;color:var(--mut)">对话</div>
  <div id="sessions"></div>
  <div id="side-label-files" style="padding:6px 14px 4px;font-size:11px;color:var(--mut);border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center">
    <span>文件</span>
    <span>
      <button class="icobtn" id="up-btn" title="上传文件" style="font-size:13px;padding:3px 5px">⬆</button>
      <input type="file" id="up-input" multiple style="display:none">
    </span>
  </div>
  <div id="filetree" style="flex:0 0 auto;max-height:34%;overflow-y:auto;padding:0 8px"></div>
  <footer>
    <button class="icobtn" id="refresh-sessions" title="刷新会话列表">⟳</button>
    <button class="icobtn" id="open-artifacts" title="文件（它做出来的东西）">📎</button>
    <button class="icobtn" id="open-skills" title="技能">🧩</button>
    <button class="icobtn" id="open-settings" title="设置">⚙️</button>
    <span style="font-size:11px;color:var(--mut);align-self:center" id="version"></span>
  </footer>
</div>
<div id="main">
  <div id="topbar">
    <button id="burger">☰</button>
    <div id="model-pick" title="点这里换模型">
      <span id="model-cur">模型加载中…</span>
      <div id="model-drop"><input id="model-search" placeholder="搜索模型…"><div id="model-items"></div></div>
    </div>
    <select id="mode" title="工作模式">
      <option value="auto">自动干活</option>
      <option value="smart_approve">重要操作问我</option>
      <option value="approve">每步都问我</option>
      <option value="chat">只聊天不动手</option>
    </select>
    <span id="model-label"></span>
    <button class="icobtn" onclick="exportChat()" title="导出对话">📤</button>
  </div>
  <div id="chat"></div>
  <div class="typing" id="typing" style="display:none">小 forge 正在干活……</div>
  <div id="inputbar">
    <input id="txt" placeholder="想让我做什么？" autocomplete="off">
    <button id="send">发送</button>
    <button id="stop">停止</button>
  </div>
</div>
<div id="art-modal" class="modal-bg"><div class="panel-box">
  <h3>📎 文件（它做出来的东西）</h3>
  <div class="fnote" style="margin-bottom:10px">它生成的图片、报表、文档都存在这里。点开预览，右键/长按可另存。</div>
  <div id="art-list"></div>
</div></div>
<div id="slash-menu" style="display:none;position:absolute;bottom:64px;left:18px;right:18px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.14);z-index:40;max-height:250px;overflow-y:auto"></div>
<div id="skills-modal" class="modal-bg"><div class="panel-box">
  <h3>🧩 小 forge 的技能（它学会的本领）</h3>
  <div class="fnote" style="margin-bottom:10px">这些是它积累的操作手册。聊天时说相关的活儿它就会自动用；也可以点「让它现在用」。</div>
  <div id="skills-list"></div>
</div></div>
<div id="modal"><div id="panel">
  <h3>⚙️ 服务商连接</h3>
  <div class="fnote" style="margin-bottom:10px">这里管"连到哪家大模型服务商"。每个档案 = 地址 + Key + 默认模型。顶栏可随时换模型（不用来这里）。</div>
  <div class="frow"><label>服务商档案</label>
    <div id="prov-list"></div>
    <div style="display:flex;gap:6px;margin-top:6px">
      <input id="prov-name" placeholder="名称，如 公司中转" style="flex:1">
      <button id="prov-add" class="mini">添加</button>
    </div>
  </div>
  <div class="frow"><label>接口地址（OpenAI 兼容 /v1 结尾）</label><input id="cfg-host" placeholder="https://.../v1/"></div>
  <div class="frow"><label>API Key</label><input id="cfg-key" type="password" placeholder="sk-..."></div>
  <div class="frow"><label>这家服务商的模型（先拉取，勾选进员工可选池）</label>
    <div style="display:flex;gap:6px;margin-bottom:8px">
      <button id="fetch-models" class="mini" style="flex:1">⟳ 拉取模型列表</button>
      <button id="test-model" class="mini" style="flex:1">🔌 测试连通</button>
    </div>
    <div id="model-pool" style="max-height:180px;overflow-y:auto;border:1px solid var(--line);border-radius:9px;padding:10px"></div>
    <div class="fnote" id="cfg-model-hint">拉取后勾选 3-5 个常用的就够；顶栏随时切换</div>
  </div>
  <button id="save-cfg" style="width:100%;padding:11px;background:var(--g);color:#fff;border:none;border-radius:9px;font-size:15px;cursor:pointer">💾 保存这家服务商</button>
  <div class="fnote" id="save-note" style="margin-top:10px"></div>
</div></div>
<script>
window.__root = '__FORGE_ROOT__';
const $=id=>document.getElementById(id);
const chat=$('chat'),txt=$('txt'),send=$('send'),stopBtn=$('stop'),typing=$('typing'),status=$('status');
let ws, sessionId=null, busy=false, modes=[], configOptions=[];
let streamEl=null, toolCards=new Map();

function connect(){
  ws=new WebSocket('ws://'+location.host);
  ws.onopen=()=>{status.classList.add('ok'); loadSessions(); loadProvidersUI(); loadFileTree(); if(!sessionId) subscribe(null);};
  ws.onclose=()=>{status.classList.remove('ok'); setTimeout(connect,2000);};
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.sys==='subscribed'){
      sessionId=m.sessionId; currentSid=m.sessionId;
      if(pendingSwitch){ const v=pendingSwitch; pendingSwitch=null; setTimeout(()=>ws.send(JSON.stringify({type:'switch_model',model:v})),800); }
      document.querySelectorAll('.sitem').forEach(el=>el.classList.toggle('active', el.dataset.sid===m.sessionId));
      modes=(m.modes&&m.modes.availableModes)||[]; configOptions=m.configOptions||[];
    let cur=(m.modes&&m.modes.currentModeId); const saved=localStorage.getItem('pf_mode');
    if(saved&&cur&&saved!==cur){ rpc2('session/set_mode',{sessionId:m.sessionId,modeId:saved}); cur=saved; }
    if(cur)$('mode').value=cur;
    renderModelLabel();
      markActiveSession();
      return;
    }
    if(m.sys==='error'){ addErr(m.text+(m.text.includes('可选池')?'。到 ⚙️ 设置里勾选它，或换顶栏列表里有的模型。':'')); setBusy(false); return; }
    if(m.sys==='hello'){ $('version').textContent='v'+m.version; return; }
    if(m.sys==='models'){
      fetchedModels=m.models||[];
      note('拉到 '+fetchedModels.length+' 个模型，下面勾选要给员工用的（勾上才算）');
      renderFetchPool();
      return;
    }
    if(m.sys==='test_result'){ note(m.ok?('✅ 连通 OK（HTTP '+m.http+'）回复: '+m.reply):('❌ 失败 HTTP '+m.http+' '+m.reply)); return; }
    if(m.sys==='providers'){ providerList=m.list||[]; renderProviders(providerList); renderModelLabel(); return; }
    if(m.sys==='model_switched'){
      // 顶栏立即反映（不信 configOptions 缓存）
      $('model-cur').textContent=m.provider+' · '+m.model;
      lastKnownModel=m.model;
      if(m.restarted){ addInfo('✅ 已切到 '+m.provider+' · '+m.model+'。刚才的对话要先重新打开：点左侧列表里的那个对话即可继续（内容都在）。'); loadSessions(); }
      else addInfo('✅ 已切到 '+m.provider+' · '+m.model+'，直接继续说话就行。');
      return;
    }
    if(m.sys==='provider_switching'){ addInfo('正在切换到「'+m.to+'」…大约 5 秒，稍等提示。'); return; }
    if(m.sys==='provider_switched'){ addInfo('✅ 已切到 '+m.provider+'（默认模型 '+m.model+'）。'); loadSessions(); return; }
    if(m.sys==='saved_config'){ note('已保存'); return; }
    if(m.rpc){ onRpc(m.rpc); return; }
    if(m.agent){ onAgentEvent(m.agent); }
  };
}
function rpc(method, params){ ws.send(JSON.stringify({type:'rpc',method,params:params||{}})); return new Promise(res=>{ const h=e=>{ const d=JSON.parse(e.data); if(d.rpc&&d.rpc.id===pending); }; /* responses come via rpc tag; poll map */ pendingMap.set(pendingId, res); }); }
let pendingId=1; const pendingMap=new Map();
const _origSend=()=>{};
function rpc2(method, params){
  const id=++pendingId;
  ws.send(JSON.stringify({type:'rpc',method,params:Object.assign({__cid:id},params||{})}));
  return new Promise(res=>pendingMap.set(id,res));
}
function onRpc(d){
  const keys=[...pendingMap.keys()];
  if(keys.length){ const k=keys[0]; const f=pendingMap.get(k); pendingMap.delete(k); f(d); }
  // load/set_config 响应都带 configOptions -> 刷新顶栏
  const r=d.result;
  if(r&&r.configOptions){
    configOptions=r.configOptions;
    if(!lastKnownModel){ const m0=r.configOptions.find(o=>o.id==='model'); if(m0&&m0.currentValue) lastKnownModel=m0.currentValue; }
    if(r.modes){ const cur=r.modes.currentModeId; if(cur)$('mode').value=cur; }
    renderModelLabel();
  }
}
function loadSessions(){ rpc2('session/list').then(d=>{ const s=(d.result&&d.result.sessions)||[]; renderSessions(s); }).catch(()=>{}); }
let currentSid=null;
function renderSessions(list){
  const box=$('sessions'); box.innerHTML='';
  const real=list.filter(s=>{const t=(s._meta&&s._meta.sessionType)||'standard';return t!=='scheduled';});
  if(!real.length){ box.innerHTML='<div style="padding:12px;font-size:12px;color:var(--mut)">还没有对话。点上面「＋ 新对话」开始。</div>'; return; }
  for(const s of real.slice(0,40)){
    const el=document.createElement('div'); el.className='sitem'+(s.sessionId===currentSid?' active':'');
    el.dataset.sid=s.sessionId;
    el.innerHTML=(s.title||'未命名').slice(0,26)+'<br><span class="t">'+(s.updatedAt||'').slice(5,16).replace('T',' ')+'</span>';
    el.onclick=()=>openSession(s.sessionId);
    const del=document.createElement('button'); del.className='sdel'; del.textContent='✕'; del.title='删除这个对话';
    del.onclick=(e)=>{ e.stopPropagation();
      if(confirm('删除对话「'+(s.title||'未命名')+'」？删除后找不回来。')){
        ws.send(JSON.stringify({type:'delete_session',sessionId:s.sessionId}));
        if(currentSid===s.sessionId){ currentSid=null; sessionId=null; chat.innerHTML=''; }
        setTimeout(loadSessions,800);
      }
    };
    el.appendChild(del);
    box.appendChild(el);
  }
}
function markActiveSession(){ /* 保留列表不动，仅由 currentSid 驱动高亮 */ }
function subscribe(sid){ ws.send(JSON.stringify({type:'subscribe',sessionId:sid})); chat.innerHTML=''; toolCards.clear(); if(!sid) addMsg('你好！我是小 forge。想做什么直接打字告诉我。','agent'); }
function openSession(sid){
  if(busy){ addErr('它正在干活，等一下或先停止。'); return; }
  // 先订阅再载入：load 的历史回放通知才能流进 UI
  ws.send(JSON.stringify({type:'subscribe',sessionId:sid}));
  chat.innerHTML=''; toolCards.clear();
  currentSid=sid; sessionId=sid;
  [...document.querySelectorAll('.sitem')].forEach(el=>el.classList.remove('active'));
  rpc2('session/load',{sessionId:sid,cwd:window.__root||'.',mcpServers:[]}).catch(()=>addErr('打开会话失败'));
}
let lastKnownModel=null;
function renderModelLabel(){
  try{
    const cur=configOptions.find(o=>o.id==='model');
    const act=(providerList.find(p=>p.active)||{});
    const model=lastKnownModel||(cur&&cur.currentValue)||'未设置';
    $('model-cur').textContent=(act.name?act.name+' · ':'')+model;
    buildModelItems();
  }catch{}
}
let providerList=[]; let curProvName=null;
function poolModels(){
  // 可选池 = 各家勾选的 models，标 (家·模型)
  const out=[];
  for(const pr of providerList) for(const m of (pr.models||[])) out.push({value:m, provider:pr.name, activeProvider:!!pr.active});
  return out;
}
function buildModelItems(filter){
  const box=$('model-items'); if(!box) return;
  const cur=configOptions.find(o=>o.id==='model');
  const pool=poolModels();
  const f=(filter||'').toLowerCase();
  const shown=pool.filter(o=>!f||(o.value+' '+o.provider).toLowerCase().includes(f)).slice(0,80);
  box.innerHTML='';

function mdRender(raw){
  let h = raw.split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;');
  const NLCH = String.fromCharCode(10);
  const parts = h.split('```');
  for (let i = 1; i < parts.length; i += 2) {
    const c = parts[i];
    const nlPos = c.indexOf(NLCH);
    parts[i] = '<pre class=\"mdcode\">' + (nlPos >= 0 ? c.slice(nlPos + 1) : c) + '</pre>';
  }
  h = parts.join('');
  h = h.split('**').join('</b>').split('</b>').map(function(x, i2){ return i2 % 2 ? '</b>' + x : x; }).join('');
  const lines = h.split(NLCH);
  const out = [];
  let tableBuf = [];
  function flushTable(){
    if (!tableBuf.length) return;
    const rows = tableBuf.map(r => r.split('|').slice(1, -1).map(c => c.trim()));
    tableBuf = [];
    if (rows.length < 2) { out.push.apply(out, arguments); return; }
    const isSep = rows[1].every(c => c.replace(/[:-]/g, '') === '');
    if (!isSep) { out.push.apply(out, arguments2); return; }
    let t = '<table class=\"mdtab\"><thead><tr>';
    for (const c of rows[0]) t += '<th>' + c + '</th>';
    t += '</tr></thead><tbody>';
    for (const r of rows.slice(2)) { t += '<tr>'; for (const c of r) t += '<td>' + c + '</td>'; t += '</tr>'; }
    t += '</tbody></table>';
    out.push(t);
  }
  let rawLines = [];
  for (const ln of lines) rawLines.push(ln);
  const kept = [];
  for (const ln of rawLines) {
    if (ln.trim().startsWith('|') && ln.trim().endsWith('|')) tableBuf.push(ln.trim());
    else { flushTable2(kept, tableBuf); kept.push(ln.startsWith('- ') || ln.startsWith('* ') ? '&bull; ' + ln.slice(2) : ln); }
  }
  flushTable2(kept, tableBuf);
  return kept.join('<br>');
}
function flushTable2(out, bufRef){
  if (!bufRef.length) return;
  const rows = bufRef.map(r => r.split('|').slice(1, -1).map(c => c.trim()));
  bufRef.length = 0;
  if (rows.length < 2 || !rows[1].every(c => c.replace(/[:-]/g, '') === '')) { out.push(rows.join ? rows.map(r=>r.join(' ')).join('<br>') : String(rows)); return; }
  let t = '<table class=\"mdtab\"><thead><tr>';
  for (const c of rows[0]) t += '<th>' + c + '</th>';
  t += '</tr></thead><tbody>';
  for (const r of rows.slice(2)) { t += '<tr>'; for (const c of r) t += '<td>' + c + '</td>'; t += '</tr>'; }
  out.push(t + '</tbody></table>');
}

  if(upd.toolCallUpdate){

    st.textContent=s==='completed'?'完成':s==='failed'?'失败':(s||'');

function onAgentEvent(p){
  if(p.method==='session/update'){
    const u=p.params.update;
    if(u.sessionUpdate==='agent_message_chunk'){ typing.style.display='none'; addMsg(u.content.text,'agent'); }
    else if(u.sessionUpdate==='user_message_chunk'){ addMsg(u.content.text,'user'); }
    else if(u.sessionUpdate==='agent_thought_chunk'){ /* keep silent */ }
    else if(u.sessionUpdate==='tool_call'||u.sessionUpdate==='tool_call_update'){ toolCard(u); }
    else if(u.sessionUpdate==='plan'){ /* future */ }
    else if(u.sessionUpdate==='available_commands_update'){}
    return;
  }
  if(p.method==='session/request_permission'){
    const opts=p.params.options||[];
    addErr('（需要确认：'+opts.map(o=>o.name).join(' / ')+'，已自动选择第一项）');
    ws.send(JSON.stringify({type:'acp_reply',callId:p.id,option:opts[0]&&opts[0].optionId}));
    return;
  }
  if(p.method==='stop'){ setBusy(false); endStream(); loadSessions(); }
}

  const msgs=[...document.querySelectorAll('.msg')].filter(m=>!m.classList.contains('info'))
    .map(m=>{
      let t=m.textContent;

    }).join(NL+NL);
  const tools=[...document.querySelectorAll('.card .ttl')].map(t=>'🔧 '+t.textContent).join(NL);
  const blob=new Blob(['PocketForge 对话导出  '+new Date().toLocaleString()+NL+NL+msgs+(tools?NL+NL+'用到的工具：'+NL+tools:'')],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='对话-'+new Date().toISOString().slice(0,10)+'.txt'; a.click();

  const v=txt.value;
  const atM=v.match(/@([^@\s]*)$/);
  if(atM){ renderAtMenu(atM[1].toLowerCase()); return; }
  if(v.startsWith('/')){
    const q=v.slice(1).toLowerCase();
    const hits=SLASH.filter(c=>c.cmd.slice(1).startsWith(q)||c.desc.includes(q));
    const menu=$('slash-menu');
    menu.innerHTML='';
    for(const c of (hits.length?hits:SLASH)){
      const el=document.createElement('div'); el.className='mi'; el.style.padding='9px 14px';
      el.innerHTML='<b>'+c.cmd+'</b> <span style="color:var(--mut);font-size:12px">'+c.desc+'</span>';
      el.onclick=()=>{ txt.value=''; menu.style.display='none'; c.run(); };
      menu.appendChild(el);
    }
    menu.style.display='block';
  } else $('slash-menu').style.display='none';
});
txt.addEventListener('keydown',e=>{
  if(e.key==='Escape') $('slash-menu').style.display='none';
});

// ---- 文件树 + 上传 + @引用 + 复制 ----
function fmtSize(n){ return n > 1048576 ? (n/1048576).toFixed(1)+'MB' : Math.round(n/1024)+'KB'; }
function fileIcon(n){
  const e=(n.match(/\.([a-z0-9]+)$/i)||[])[1]?.toLowerCase()||'';
  if(['png','jpg','jpeg','gif','webp','svg'].includes(e))return'🖼️';
  if(['xlsx','xls','csv'].includes(e))return'📊';
  if(['docx','doc'].includes(e))return'📄';
  if(['pdf'].includes(e))return'📕';
  if(['html','htm'].includes(e))return'🌐';
  if(['md','txt','log','json'].includes(e))return'📝';
  return'📦';
}
function loadFileTree(){
  fetch('/api/artifacts').then(r=>r.json()).then(list=>{
    const box=$('filetree'); box.innerHTML='';
    if(!list.length){ box.innerHTML='<div style="padding:6px;font-size:12px;color:var(--mut)">暂无文件</div>'; return; }
    for(const f of list.slice(0,60)){
      const el=document.createElement('div'); el.className='ftree'; el.dataset.path=f.name;
      el.innerHTML='<span class="ico">'+fileIcon(f.name)+'</span>'+f.name.split('/').pop()+'<span class="sz">'+fmtSize(f.size)+'</span>';
      el.title='点击预览 · Shift+点复制 · @'+f.name+' 可在消息里引用';
      el.onclick=e=>{
        if(e.shiftKey){ copyArtifact(f); return; }
        window.open('/preview/'+encodeURIComponent(f.name),'_blank');
      };
      box.appendChild(el);
    }
  }).catch(()=>{});
}
function copyArtifact(f){
  const e2=(f.name.match(/\.([a-z0-9]+)$/i)||[])[1]?.toLowerCase();
  if(['png','jpg','jpeg','gif','webp','bmp'].includes(e2)){
    fetch('/artifact/'+encodeURIComponent(f.name)).then(r=>r.blob()).then(b=>navigator.clipboard.write([new ClipboardItem({['image/' + (e2 === 'jpg' ? 'jpeg' : e2)]: b})])).then(()=>note('已复制图片到剪贴板')).catch(()=>fallbackCopyPath(f.name));
  } else {
    fetch('/artifact/'+encodeURIComponent(f.name)).then(r=>r.text()).then(t=>navigator.clipboard.writeText(t)).then(()=>note('已复制内容到剪贴板')).catch(()=>fallbackCopyPath(f.name));
  }
}
function fallbackCopyPath(name){ ws.send(JSON.stringify({type:'copy_artifact',name})); note('已请求复制（系统剪贴板）'); }
$('up-btn').onclick=()=>$('up-input').click();
$('up-input').onchange=async()=>{
  for(const f of $('up-input').files){
    const buf=await f.arrayBuffer();
    await fetch('/api/upload?name='+encodeURIComponent(f.name),{method:'POST',body:buf});
  }
  $('up-input').value='';
  loadFileTree(); note('上传完成，已在文件区');
};
// 拖拽上传
document.addEventListener('dragover',e=>{e.preventDefault();});
document.addEventListener('drop',async e=>{
  e.preventDefault();
  for(const f of (e.dataTransfer||{}).files||[]){
    const buf=await f.arrayBuffer();
    await fetch('/api/upload?name='+encodeURIComponent(f.name),{method:'POST',body:buf});
  }
  if((e.dataTransfer||{}).files&&e.dataTransfer.files.length){ loadFileTree(); addInfo('收到 '+e.dataTransfer.files.length+' 个文件（在左侧「文件」区，消息里用 @ 引用即可让我处理）'); }
});

connect();
</script>
