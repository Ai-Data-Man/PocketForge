<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小 forge · 数字员工</title>
<style>
*{box-sizing:border-box}
:root{--g:#0b6b3a;--g2:#0e8749;--bg:#f2f5f3;--line:#dde8e1;--tx:#1a2a1a;--mut:#6a7a70}
body{font-family:"Microsoft YaHei",system-ui,sans-serif;margin:0;background:var(--bg);color:var(--tx);height:100vh;display:flex;overflow:hidden}
/* sidebar */
#side{width:250px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;transition:margin .2s}
#side.hidden{margin-left:-250px}
#side header{padding:14px 14px 8px;font-weight:bold;font-size:16px;display:flex;align-items:center;gap:8px}
#newchat{margin:4px 14px 10px;padding:9px;background:var(--g);color:#fff;border:none;border-radius:9px;cursor:pointer;font-size:14px;font-family:inherit}
#sessions{flex:0 1 auto;overflow-y:auto;padding:0 8px 8px;max-height:42%}

.sitem{padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;line-height:1.4;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sitem:hover{background:#f0f5f2}
.sitem.active{background:#e2efe7;font-weight:bold}
.sitem .t{color:var(--mut);font-size:11px;font-weight:normal}
.sdel{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:none;color:#b66;cursor:pointer;font-size:12px;display:block;opacity:.18}
.sitem{position:relative}
.sitem:hover .sdel,.sitem.active .sdel{opacity:1}
#side footer{border-top:1px solid var(--line);padding:8px 14px;display:flex;gap:8px}
.icobtn{background:none;border:none;cursor:pointer;font-size:15px;padding:6px;border-radius:7px}
.icobtn:hover{background:#f0f5f2}
/* main */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{background:#fff;border-bottom:1px solid var(--line);padding:9px 14px;display:flex;align-items:center;gap:10px;font-size:14px}
#burger{background:none;border:none;font-size:18px;cursor:pointer}
#mode{padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-family:inherit;font-size:13px;cursor:pointer}
#model-label{color:var(--mut);font-size:12px;margin-left:auto}
#model-pick{position:relative;cursor:pointer;padding:5px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px;user-select:none;max-width:230px}
#model-cur{display:inline-block;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
#model-pick:hover{border-color:var(--g)}
#model-drop{display:none;position:absolute;top:110%;left:0;z-index:30;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.12);width:300px}
#model-pick.open #model-drop{display:block}
#model-search{width:100%;box-sizing:border-box;border:none;border-bottom:1px solid var(--line);padding:9px 12px;border-radius:10px 10px 0 0;outline:none;font-size:13px;font-family:inherit}
#model-items{max-height:280px;overflow-y:auto}
#model-items .mi{padding:8px 12px;font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#model-items .mi:hover{background:#f0f5f2}
#model-items .mi.cur{background:#e2efe7;font-weight:bold}
.model-note{padding:6px 12px;font-size:11px;color:var(--mut)}
/* right workspace sidebar */
#rside{width:300px;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;transition:margin .2s;margin-right:-300px}
#rside.open{margin-right:0}
#pane-cur,#pane-all{flex:1;min-height:0;display:flex;flex-direction:column}
#all-list{flex:1;overflow-y:auto;margin:0 4px}
#rside header{padding:10px 12px;font-weight:bold;font-size:13.5px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.rtabs{display:flex;gap:2px;flex:1}
.rtab{border:none;background:none;cursor:pointer;font-size:13px;padding:7px 9px;border-radius:8px;color:var(--mut);font-family:inherit}
.rtab.on{background:#e2efe7;color:#0b3a20;font-weight:bold}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 11px;font-size:11.5px;cursor:pointer;color:var(--mut)}
.chip.on{background:#0b6b3a;border-color:#0b6b3a;color:#fff}
.tdir>summary{list-style:none;cursor:pointer;padding:5px 4px;border-radius:7px;font-size:12.5px;display:flex;align-items:center;gap:5px}
.tdir>summary:hover{background:#f0f5f2}
.tnode{display:flex;align-items:center;gap:5px;padding:4px 4px;border-radius:7px;font-size:12.5px;cursor:pointer}
.tnode:hover{background:#f0f5f2}
.tnode .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tnode .sz{color:var(--mut);font-size:10px;flex-shrink:0}
.bdg{font-size:9.5px;background:#eef3ef;color:#4a6a58;border-radius:4px;padding:1px 5px;flex-shrink:0}
.bdg.link{background:#fdf6e3;color:#8a6d1a}
.tact{border:none;background:none;cursor:pointer;font-size:11px;padding:1px 3px;border-radius:4px;opacity:.25;flex-shrink:0}
.tnode:hover .tact,.tdir:hover .tact{opacity:1}
.tact:hover{background:#e2efe7}
.wrow{padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin:0 10px 8px;font-size:12.5px}
.wrow .t1{display:flex;align-items:center;gap:6px;font-weight:bold}
.wrow .t2{color:var(--mut);font-size:11px;margin:3px 0 6px}
.wrow button{border:1px solid var(--line);background:#fff;border-radius:7px;font-size:11.5px;padding:4px 10px;cursor:pointer;margin-right:5px}
.wrow button.danger{color:#b00020}
.card summary{position:relative}
.expl-pop{position:absolute;top:100%;left:0;right:auto;word-break:break-word;min-width:260px;max-width:420px;z-index:6;background:#fffdf3;border:1px solid #e6d79c;border-radius:10px;padding:9px 12px;font-size:12.5px;line-height:1.65;color:#4a3f1a;box-shadow:0 8px 24px rgba(0,0,0,.14);white-space:pre-wrap;font-family:"Microsoft YaHei",system-ui,sans-serif;text-align:left}
.sec{margin-bottom:8px}
.sech{display:inline-block;font-size:10.5px;color:#4a6a58;background:#eef3ef;border-radius:4px;padding:1px 7px;margin-bottom:4px}
.sec pre{margin:2px 0 0;white-space:pre-wrap;font-family:Consolas,monospace;font-size:11.5px;color:#345;max-height:180px;overflow:auto}
.tdir>summary.sel{background:#e2efe7}
/* 面包屑路径条（文件管理器范式） */
#cur-head{display:flex;align-items:center;gap:3px;flex-wrap:wrap;padding:8px 10px 0;font-size:12px}
#cur-head .bcb{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 7px;cursor:pointer;font-size:12px;line-height:1}
#cur-head .bcb:disabled{opacity:.35;cursor:default}
.bseg{cursor:pointer;color:#0b6b3a;padding:2px 4px;border-radius:5px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bseg:hover{background:#eef5f0}
.bseg.cur{font-weight:bold;color:#1a2a1a;cursor:default}
.bsep{color:var(--mut)}
.absline{width:100%;font-size:10px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 0 4px;direction:rtl;text-align:left}
#rside header{padding:12px 14px 8px;font-weight:bold;font-size:14px;display:flex;align-items:center;justify-content:space-between}
#rside .toolbar{padding:0 10px 8px;display:flex;gap:6px}
#rside .toolbar .mini{flex:1;text-align:center;padding:7px 4px;font-size:12px}
#rtree{flex:1;overflow-y:auto;padding:0 8px}
.rdir{padding:4px 6px;font-size:11px;color:var(--mut);font-weight:bold;text-transform:uppercase;letter-spacing:.5px;margin-top:8px;border-bottom:1px solid var(--line)}
.rfile{padding:5px 6px;border-radius:7px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--tx)}
.rfile:hover{background:#f0f5f2}
.rfile .ico{width:18px;text-align:center;flex-shrink:0}
.rfile .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rfile .sz{color:var(--mut);font-size:10px;flex-shrink:0}
#link-row{padding:8px 10px;border-top:1px solid var(--line)}
#link-row input{width:100%;box-sizing:border-box;padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-size:12px;margin-bottom:5px}
#at-menu{display:none;position:absolute;bottom:100%;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 -4px 20px rgba(0,0,0,.1);z-index:50;max-height:200px;overflow-y:auto;margin-bottom:4px}
#at-menu .mi{padding:8px 14px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px}
#at-menu .mi:hover,#at-menu .mi.sel{background:#eef5f0}
#chat{flex:1;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:11px 15px;border-radius:13px;font-size:15.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--g);color:#fff;border-bottom-right-radius:4px}
.msg.agent{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.card{align-self:flex-start;width:80%;background:#fff;border:1px dashed #c4d6cb;border-radius:11px;font-size:13px;overflow:hidden}
.card summary{padding:8px 13px;cursor:pointer;color:#3a5a4a;user-select:none;list-style:none;display:flex;gap:8px;align-items:center}
.card summary::before{content:'🔧'}
.card[open] summary{border-bottom:1px solid var(--line)}
.card .body{padding:10px 13px;white-space:pre-wrap;font-family:Consolas,monospace;font-size:12px;color:#445;max-height:260px;overflow:auto;background:#fafcfb}
.card .st{margin-left:auto;font-size:11px;color:var(--mut)}
.st.done{color:var(--g);font-weight:bold}
.st.err{color:#b00020;font-weight:bold}
.typing{align-self:flex-start;color:var(--mut);font-size:13px;padding:2px 15px}
/* input */
#inputbar{position:relative;display:flex;gap:9px;padding:13px 18px;background:#fff;border-top:1px solid var(--line)}
#txt{flex:1;font-size:16px;padding:11px 13px;border:2px solid var(--line);border-radius:11px;outline:none;font-family:inherit}
#txt:focus{border-color:var(--g)}
#send{font-size:16px;padding:11px 22px;background:var(--g);color:#fff;border:none;border-radius:11px;cursor:pointer}
#send:disabled{background:#9db8ac}
#stop{font-size:14px;padding:11px 16px;background:#b00020;color:#fff;border:none;border-radius:11px;cursor:pointer;display:none}
/* settings modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:9}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:9}
.modal-bg.on{display:flex}
.panel-box{background:#fff;border-radius:14px;width:520px;max-height:86vh;overflow-y:auto;padding:20px 22px}
.skill{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:10px}
.skill .nm{font-weight:bold;font-size:14px}
.skill .ds{font-size:12.5px;color:var(--mut);margin:4px 0 8px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.skill .ops{display:flex;gap:8px}
.skill pre{background:#fafcfb;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:11.5px;max-height:220px;overflow:auto;white-space:pre-wrap;margin:8px 0 0}
#modal.on{display:flex}
#panel{background:#fff;border-radius:14px;width:430px;max-height:80vh;overflow-y:auto;padding:20px 22px}
#panel h3{margin:0 0 12px;font-size:17px}
.frow{margin-bottom:14px}
.frow label{display:block;font-size:13px;color:var(--mut);margin-bottom:5px}
.frow input,.frow select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit}
.fnote{font-size:12px;color:var(--mut);margin-top:4px}
.mini{padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:13px;font-family:inherit}
.prov{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;font-size:13px}
.prov.active{border-color:var(--g);background:#eaf4ee}
.prov .nm{font-weight:bold}
.prov .hd{color:var(--mut);font-size:11px;flex:1}
.mpick{display:block;font-size:13px;padding:4px 2px;cursor:pointer}
.prov button{border:none;background:none;cursor:pointer;font-size:13px}
#save-cfg{width:100%;padding:11px;background:var(--g);color:#fff;border:none;border-radius:9px;font-size:15px;cursor:pointer;margin-top:6px}
.mbar{margin-top:8px;display:flex;gap:6px;opacity:0;transition:opacity .15s}
.msg:hover .mbar{opacity:1}
.msgbtn{border:none;background:rgba(11,107,58,.08);color:#0b6b3a;border-radius:6px;font-size:11px;padding:3px 10px;cursor:pointer}
.msg.user .msgbtn{background:rgba(255,255,255,.25);color:#fff}
.msg.info{background:#eef6f1;border-color:#cfe4d8;color:#2a4a3a;font-size:13.5px}
.mdtab{border-collapse:collapse;margin:6px 0;font-size:13.5px}
.mdtab th,.mdtab td{border:1px solid #d5e2da;padding:4px 10px}
.mdtab th{background:#eef5f0}
.mdcode{background:#f6f8f6;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:Consolas,monospace;font-size:12px;overflow-x:auto;white-space:pre-wrap;margin:6px 0}
.msg.agent code{background:#eef3ef;border-radius:4px;padding:1px 5px;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:#ff6b6b;display:inline-block}
.dot.ok{background:#7dff9e}
.expl{white-space:pre-wrap;font-family:"Microsoft YaHei",system-ui,sans-serif;color:#2a4a3a;background:#eef6f1;border-radius:8px;padding:8px 10px;margin-top:8px;font-size:12.5px;line-height:1.6}
.expbtn{margin-left:6px}
.vbtn{border:none;background:none;cursor:pointer;font-size:12px;padding:2px 4px;border-radius:5px;flex-shrink:0}
.vbtn:hover{background:#e2efe7}
.vlist{border-top:1px dashed var(--line);margin:4px 0 6px;padding:4px 6px;background:#fafcfb;border-radius:7px}
.vitem{display:flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 0;color:var(--tx)}
.vitem .vt{color:var(--mut);flex-shrink:0}
.vitem .vm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vitem button{border:none;background:rgba(11,107,58,.08);color:#0b6b3a;border-radius:5px;font-size:10.5px;padding:2px 7px;cursor:pointer;flex-shrink:0}
</style>
</head>
<body>
<div id="side">
  <header><span class="dot" id="status"></span>小 forge</header>
  <button id="newchat">＋ 新对话</button>
  <div id="side-label-sess" style="padding:2px 14px;font-size:11px;color:var(--mut)">对话</div>
  <div id="sessions"></div>
  <footer>
    <button class="icobtn" id="refresh-sessions" title="刷新会话列表">⟳</button>
    <button class="icobtn" id="open-skills" title="技能">🧩</button>
    <button class="icobtn" id="open-settings" title="设置">⚙️</button>
    <span style="font-size:11px;color:var(--mut);align-self:center" id="version"></span>
  </footer>
</div>
<div id="main">
  <div id="topbar">
    <button id="burger">☰</button>
    <div id="model-pick" title="点这里换模型">
      <span id="model-cur">模型加载中…</span>
      <div id="model-drop"><input id="model-search" placeholder="搜索模型…"><div id="model-items"></div></div>
    </div>
    <select id="mode" title="工作模式">
      <option value="auto">自动干活</option>
      <option value="smart_approve">重要操作问我</option>
      <option value="approve">每步都问我</option>
      <option value="chat">只聊天不动手</option>
    </select>
    <span id="model-label"></span>
    <button class="icobtn" onclick="exportChat()" title="导出对话">📤</button>
    <button class="icobtn" id="rside-toggle" title="工作区文件">📁</button>
  </div>
  <div id="chat"></div>
  <div class="typing" id="typing" style="display:none">小 forge 正在干活……</div>
  <div id="inputbar">
    <input id="txt" placeholder="想让我做什么？输入 @ 引用文件" autocomplete="off">
    <button id="send">发送</button>
    <button id="stop">停止</button>
    <div id="at-menu"></div>
  </div>
</div>
<div id="rside">
  <header>
    <span class="rtabs">
      <button class="rtab on" id="tabbtn-cur">📁 本对话</button>
      <button class="rtab" id="tabbtn-all">🗂 浏览全部</button>
    </span>
    <button class="icobtn" id="ws-refresh" title="刷新">⟳</button>
    <button class="icobtn" id="rside-close">✕</button>
  </header>
  <div id="pane-cur">
    <div class="toolbar">
      <button class="mini" id="up-btn2" title="把文件拷进本工作区">⬆ 上传</button>
      <button class="mini" id="nf-btn" title="在工作区根目录新建文件">＋文件</button>
      <button class="mini" id="nd-btn" title="新建文件夹">＋目录</button>
      <button class="mini" id="link-btn" title="链接电脑上其他文件夹">🔗 外链</button>
      <input type="file" id="up-input" multiple style="display:none">
    </div>
    <div style="padding:0 10px 4px"><label class="fnote" style="cursor:pointer"><input type="checkbox" id="att-only"> 只看附件（<span id="att-n">0</span>）</label></div>
    <div id="rtree"></div>
    <div id="link-row" style="display:none">
      <input id="link-path" placeholder="外部文件夹路径，如 C:\Users\...">
      <button class="mini" id="link-ok" style="width:100%;margin-top:4px">链接此目录</button>
    </div>
  </div>
  <div id="pane-all" style="display:none">
    <div style="padding:6px 10px 4px;display:flex;gap:6px">
      <input id="all-q" placeholder="搜索名字…" style="flex:1;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;outline:none">
      <select id="all-sort" style="border:1px solid var(--line);border-radius:8px;font-size:12px;background:#fff">
        <option value="mtime">最近活动</option><option value="name">名称</option><option value="bytes">体积</option>
      </select>
    </div>
    <div id="all-chips" style="padding:0 10px 6px;display:flex;gap:5px"></div>
    <div id="all-list"></div>
    <div id="all-pager" style="padding:6px 10px;text-align:center"></div>
  </div>
</div>
<div id="slash-menu" style="display:none;position:absolute;bottom:64px;left:18px;right:18px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.14);z-index:40;max-height:250px;overflow-y:auto"></div>
<div id="skills-modal" class="modal-bg"><div class="panel-box">
  <h3>🧩 小 forge 的技能（它学会的本领）</h3>
  <div class="fnote" style="margin-bottom:10px">这些是它积累的操作手册。聊天时说相关的活儿它就会自动用；也可以点「让它现在用」。</div>
  <div id="skills-list"></div>
</div></div>
<div id="modal"><div id="panel">
  <h3>⚙️ 服务商连接</h3>
  <div class="fnote" style="margin-bottom:10px">这里管"连到哪家大模型服务商"。每个档案 = 地址 + Key + 默认模型。顶栏可随时换模型（不用来这里）。</div>
  <div class="frow"><label>服务商档案</label>
    <div id="prov-list"></div>
    <div style="display:flex;gap:6px;margin-top:6px">
      <input id="prov-name" placeholder="名称，如 公司中转" style="flex:1">
      <button id="prov-add" class="mini">添加</button>
    </div>
  </div>
  <div class="frow"><label>接口地址（OpenAI 兼容 /v1 结尾）</label><input id="cfg-host" placeholder="https://.../v1/"></div>
  <div class="frow"><label>API Key</label><input id="cfg-key" type="password" placeholder="sk-..."></div>
  <div class="frow"><label>这家服务商的模型（先拉取，勾选进员工可选池）</label>
    <div style="display:flex;gap:6px;margin-bottom:8px">
      <button id="fetch-models" class="mini" style="flex:1">⟳ 拉取模型列表</button>
      <button id="test-model" class="mini" style="flex:1">🔌 测试连通</button>
    </div>
    <div id="model-pool" style="max-height:180px;overflow-y:auto;border:1px solid var(--line);border-radius:9px;padding:10px"></div>
    <div class="fnote" id="cfg-model-hint">拉取后勾选 3-5 个常用的就够；顶栏随时切换</div>
  </div>

function wssend(o){ if(ws&&ws.readyState===1){ ws.send(JSON.stringify(o)); return true; } addInfo('服务还没连上，正在自动重连，几秒后再试。'); return false; }
function rpc2(method, params){
  const id=++pendingId;
  wssend({type:'rpc',method,params:Object.assign({__cid:id},params||{})});
  return new Promise(res=>pendingMap.set(id,res));
}
function onRpc(d){
  // I8(审查s15): 优先按桥回显的关联 id 结算；FIFO 只兜底旧消息
  const cid=(d&&d.__cid)!==undefined?d.__cid:null;
  if(cid!==null&&pendingMap.has(cid)){ const f=pendingMap.get(cid); pendingMap.delete(cid); f(d); }
  else { const keys=[...pendingMap.keys()]; if(keys.length){ const k=keys[0]; const f=pendingMap.get(k); pendingMap.delete(k); f(d); } }
  // load/set_config 响应都带 configOptions -> 刷新顶栏
  const r=d.result;
  if(r&&r.configOptions){
    configOptions=r.configOptions;
    if(!lastKnownModel){ const m0=r.configOptions.find(o=>o.id==='model'); if(m0&&m0.currentValue) lastKnownModel=m0.currentValue; }
    if(r.modes){ const cur=r.modes.currentModeId; if(cur)$('mode').value=cur; }
    renderModelLabel();
  }
}

function mdRender(raw){
  let h = raw.split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;');
  const NLCH = String.fromCharCode(10);
  const parts = h.split('```');
  for (let i = 1; i < parts.length; i += 2) {
    const c = parts[i];
    const nlPos = c.indexOf(NLCH);
    parts[i] = '<pre class=\"mdcode\">' + (nlPos >= 0 ? c.slice(nlPos + 1) : c) + '</pre>';
  }
  h = parts.join('');
  h = h.split('**').join('</b>').split('</b>').map(function(x, i2){ return i2 % 2 ? '</b>' + x : x; }).join('');
  const lines = h.split(NLCH);
  let tableBuf = [];
  const kept = [];
  for (const ln of lines) {
    if (ln.trim().startsWith('|') && ln.trim().endsWith('|')) tableBuf.push(ln.trim());
    else { flushTable2(kept, tableBuf); kept.push(ln.startsWith('- ') || ln.startsWith('* ') ? '&bull; ' + ln.slice(2) : ln); }
  }
  flushTable2(kept, tableBuf);
  return kept.join('<br>');
}
function flushTable2(out, bufRef){
  if (!bufRef.length) return;
  const rows = bufRef.map(r => r.split('|').slice(1, -1).map(c => c.trim()));
  bufRef.length = 0;
  if (rows.length < 2 || !rows[1].every(c => c.replace(/[:-]/g, '') === '')) { out.push(rows.join ? rows.map(r=>r.join(' ')).join('<br>') : String(rows)); return; }
  let t = '<table class=\"mdtab\"><thead><tr>';
  for (const c of rows[0]) t += '<th>' + c + '</th>';
  t += '</tr></thead><tbody>';
  for (const r of rows.slice(2)) { t += '<tr>'; for (const c of r) t += '<td>' + c + '</td>'; t += '</tr>'; }
  out.push(t + '</tbody></table>');
}

function toolCard(upd){

  const ttl=card.querySelector('.ttl'), st=card.querySelector('.st'), body=card.querySelector('.body');
  if(upd.title) ttl.textContent=upd.title;

  const rin=(upd.rawInput!==undefined)?upd.rawInput:(upd.toolCallUpdate&&upd.toolCallUpdate.rawInput);
  if(rin!==undefined&&rin!==null&&!card._inp){
    card._inp=true;

        setTimeout(()=>{ b.disabled=false; b.textContent='这是干啥？'; },20000);

}
function onAgentEvent(p){

function renderProviders(list){
  providerList=list;
  const box=$('prov-list'); box.innerHTML='';
  if(!list.length){ box.innerHTML='<div class="fnote">还没有服务商。在下面填：名称+地址+Key，点「添加」。</div>'; }
  let selected=null;
  for(const pr of list){
    const el=document.createElement('div'); el.className='prov'+(pr.active?' active':'');
    el.innerHTML='<span class="nm">'+pr.name+'</span><span class="hd">'+((pr.models||[]).length+' 个模型 · '+(pr.hasKey?'🔑':'⚠无key'))+'</span>';
    const use=document.createElement('button'); use.textContent=pr.active?'✓使用中':'启用';
    use.onclick=(e)=>{e.stopPropagation(); wssend({type:'providers',save:true,activate:pr.name}); note('已切换到 '+pr.name); };
    const del=document.createElement('button'); del.textContent='✕';
    del.onclick=(e)=>{e.stopPropagation(); if(confirm('删除服务商「'+pr.name+'」？')) wssend({type:'providers',save:true,remove:pr.name}); };
    el.appendChild(use); el.appendChild(del);
    el.onclick=()=>{ selected=pr; fillProvForm(pr); renderModelPool(pr); };
    if(pr.active && !selected) selected=pr;
    box.appendChild(el);
  }
  if(selected){ renderModelPool(selected); fillProvForm(selected); }
}

function fillProvForm(pr){
  curProvName=pr.name;
  $('cfg-host').value=pr.host||'';
  $('cfg-key').value='';
  $('prov-name').value='';
}
let fetchedModels=null;
function renderFetchPool(){
  const box=$('model-pool'); if(!box)return;
  const pr=providerList.find(x=>x.name===curProvName);
  const inPool=new Set((pr&&pr.models)||[]);
  box.innerHTML='<div class="fnote" style="margin:6px 0">勾选进可选池（已勾 '+(pr&&pr.models||[]).length+' 个）：</div>';
  const wrap=document.createElement('div'); wrap.style.cssText='max-height:150px;overflow-y:auto';
  for(const m of fetchedModels){
    const lab=document.createElement('label'); lab.className='mpick';
    const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=inPool.has(m);
    cb.onchange=()=>{
      const cur=providerList.find(x=>x.name===curProvName);
      if(!cur)return;
      cur.models=cb.checked?[...new Set([...(cur.models||[]),m])]:(cur.models||[]).filter(x=>x!==m);
      wssend({type:'providers',save:true,update:{name:curProvName,models:cur.models}});
      box.firstChild.innerHTML='勾选进可选池（已勾 '+cur.models.length+' 个）：';
      note(cb.checked?('已加入 '+m):('已移除 '+m));
    };
    lab.appendChild(cb); lab.appendChild(document.createTextNode(' '+m));
    wrap.appendChild(lab);
  }
  box.appendChild(wrap);
}
function renderModelPool(pr){
  const box=$('model-pool'); if(!box) return;
  box.innerHTML='<div class="fnote" style="margin:6px 0">「'+pr.name+'」可选池（勾选的才出现在顶栏）：</div>';
  if(!(pr.models||[]).length){ box.innerHTML+='<div class="fnote">还没勾任何模型。点「⟳ 拉取模型列表」然后勾选。</div>'; return; }
  for(const m of pr.models){
    const lab=document.createElement('label'); lab.className='mpick';
    const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=true; cb.value=m;
    cb.onchange=()=>{ // 取消勾选=从池中移除
      if(!cb.checked && curProvName){
        const upd=providerList.find(x=>x.name===curProvName);
        if(upd){ upd.models=upd.models.filter(x=>x!==m);
          wssend({type:'providers',save:true,update:{name:curProvName,models:upd.models}});
          note('已从可选池移除 '+m); }
      }
    };
    lab.appendChild(cb); lab.appendChild(document.createTextNode(' '+m));
    box.appendChild(lab);
  }
  const addrow=document.createElement('div'); addrow.style.cssText='display:flex;gap:6px;margin-top:8px';
  addrow.innerHTML='<input id="pool-add" placeholder="手动加一个模型名" style="flex:1;padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-size:12px"><button class="mini" id="pool-add-btn">加入</button>';
  box.appendChild(addrow);
  setTimeout(()=>{
    const btn=document.getElementById('pool-add-btn');
    if(btn) btn.onclick=()=>{
      const v=document.getElementById('pool-add').value.trim(); if(!v||!curProvName)return;
      const upd=providerList.find(x=>x.name===curProvName);
      if(upd&&!upd.models.includes(v)){ upd.models.push(v);
        wssend({type:'providers',save:true,update:{name:curProvName,models:upd.models}});
        note('已加入 '+v); renderModelPool(upd); }
    };
  },0);
}

let skillCmds=[]; // 技能动态并入 slash 菜单
async function loadSkillCmds(){
  try{

    skillCmds=list.map(sk=>({cmd:'/技能·'+sk.name, alias:[sk.name], desc:(sk.description||'让它按学会的本领来做').slice(0,42), isSkill:true,

loadSkillCmds();
const SLASH=[
  {cmd:'/新对话', alias:['new','xin','开新'], desc:'开始一个新对话', run:()=>subscribe(null)},
  {cmd:'/技能', alias:['skills','jineng'], desc:'看它学会的本领', run:()=>$('open-skills').click()},
  {cmd:'/文件', alias:['files','wenjian','工作区'], desc:'打开工作区文件面板', run:()=>$('rside-toggle').click()},
  {cmd:'/设置', alias:['settings','shezhi','服务商','模型'], desc:'服务商连接与模型', run:()=>$('open-settings').click()},
  {cmd:'/体检', alias:['check','tijian','自检'], desc:'给它做全身检查', run:()=>{$('txt').value='做个体检'; submit();}},
  {cmd:'/导出', alias:['export','daochu','保存对话'], desc:'把这段对话存成文本', run:()=>exportChat()},
];
function slashHits(q){
  const all=SLASH.concat(skillCmds);
  if(!q) return all;
  q=q.toLowerCase();
  return all.filter(c=>{
    const hay=(c.cmd.slice(1)+' '+(c.desc||'')+' '+(c.alias||[]).join(' ')).toLowerCase();
    return hay.split(/[\s\/·]+/).some(t=>t.startsWith(q)) || hay.includes(q);
  });
}

  const menu=$('slash-menu');
  if(v.startsWith('/')){
    slashCur=slashHits(v.slice(1));
    menu.innerHTML='';
    for(const c of slashCur.slice(0,14)){
      const el=document.createElement('div'); el.className='mi'; el.style.padding='9px 14px';

      el.onclick=()=>{ txt.value=''; menu.style.display='none'; c.run(); };
      menu.appendChild(el);
    }
    menu.style.display=slashCur.length?'block':'none';
  } else { menu.style.display='none'; slashCur=[]; }
});

// ---- 文件树 + 上传 + @引用 + 复制 ----
function fmtSize(n){ return n > 1048576 ? (n/1048576).toFixed(1)+'MB' : Math.round(n/1024)+'KB'; }
function fileIcon(n){
  const e=(n.match(/\.([a-z0-9]+)$/i)||[])[1]?.toLowerCase()||'';
  if(['png','jpg','jpeg','gif','webp','svg'].includes(e))return'🖼️';
  if(['xlsx','xls','csv'].includes(e))return'📊';
  if(['docx','doc'].includes(e))return'📄';
  if(['pdf'].includes(e))return'📕';
  if(['html','htm'].includes(e))return'🌐';
  if(['md','txt','log','json'].includes(e))return'📝';
  return'📦';
}
// ---- 工作区（ADR-0007/0008）：本对话文件树始终跟随会话；「浏览全部」检索其他工作区 ----
let lastSessions=[]; let archSet={}; let delWarned=false;
let allFilter={q:'',sort:'mtime',chip:'active',page:1};
const PAGE_N=30;

async function loadArch(){ try{ const r=await fetch('/api/sessions/archive'); archSet=((await r.json()).arch)||{}; }catch{ archSet={}; } }
async function archiveSession(sid,arch){
  try{
    const r=await fetch('/api/sessions/archive',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sid,archived:arch})});
    const d=await r.json();
    if(d.ok){ await loadArch(); loadSessions(); loadWorkspaces(); note(arch?'已归档':'已取消归档'); }
    else alert('操作失败: '+(d.err||''));
  }catch(e){ alert('操作失败: '+e.message); }
}
function askDeleteSession(s){
  // 单向门：删除只从归档组发起；首次删除给完整后果说明（内存级标志，每次打开页面重新提醒）
  if(!delWarned){
    if(!confirm('第一次删除，先说清楚：\n\n· 这段对话的聊天记录会被永久删除，找不回来。\n· 它的工作区文件不会被立刻删掉，会变成「未关联」，以后可在右侧「浏览全部」里清理。\n\n确定要删除吗？')) return;
    delWarned=true;
  } else if(!confirm('删除对话「'+(s.title||'未命名')+'」？记录不可恢复。')) return;
  wssend({type:'delete_session',sessionId:s.sessionId});
  if(currentSid===s.sessionId){ currentSid=null; sessionId=null; chat.innerHTML=''; }
  setTimeout(loadSessions,800);
}

async function loadWorkspaces(){ try{ const r=await fetch('/api/workspaces'); wsList=(await r.json())||[]; renderAllPane(); }catch{} }
async function ensureWs(){
  if(!sessionId) return;
  await loadWorkspaces();
  const mine=wsList.find(w=>w.sid===sessionId);
  if(mine){ curWs=mine.id; renderCurPane(); return; }
  try{
    const r=await fetch('/api/ws/new?sid='+encodeURIComponent(sessionId));
    const d=await r.json();
    if(d.ok) curWs=d.ws;
  }catch{}
  await loadWorkspaces(); renderCurPane();
}
function sessionTitle(sid){ const s=lastSessions.find(x=>x.sessionId===sid); return s?(s.title||'未命名'):null; }
function wsDisplayName(w){
  if(w.sid===sessionId){ const t=sessionTitle(w.sid); if(t) return t; }
  return w.id==='ws-imported'?'旧文件（导入）':('对话 '+w.id.slice(3));
}
function wsStateLabel(w){
  if(w.sid===sessionId) return '本对话';
  if(w.state==='archived') return '已归档';
  if(w.state==='active') return sessionTitle(w.sid)||'活跃对话';
  return '未关联';
}

// ===== 本对话 pane：真目录树 =====
async function renderCurPane(){
  const box=$('rtree');
  if(!curWs){ box.innerHTML='<div class="fnote" style="padding:8px">正在准备工作区…</div>'; return; }
  try{
    const r=await fetch('/api/ws/tree?ws='+encodeURIComponent(curWs));
    const d=await r.json();
    const root=d.root||{children:[]};
    const attN=(d.attachments||[]).length;
    $('att-n').textContent=attN;
    box.innerHTML='';
    const headId='cur-head';
    let h=$(headId);
    if(!h){ h=document.createElement('div'); h.id=headId; box.parentNode.insertBefore(h,box); }
    markSel();
    if(!(root.children||[]).length){ box.innerHTML='<div class="fnote" style="padding:8px">还是空的。上传、拖入文件，或让我干活生成。</div>'; return; }
    if($('att-only').checked){
      const flat=[];
      (function w(n){ for(const c of (n.children||[])){ if(c.type==='file'&&c.att) flat.push(c); w(c);} })(root);
      if(!flat.length){ box.innerHTML='<div class="fnote" style="padding:8px">还没有附件（拷进来的文件）。</div>'; return; }
      for(const f of flat) box.appendChild(fileNode(f,0));
      return;
    }
    for(const c of (root.children||[])) box.appendChild(dirOrFileNode(c,0));
  }catch(e){ box.innerHTML='<div class="fnote" style="padding:8px">读取失败</div>'; }
}
function tactBtn(txt,title,fn){
  const b=document.createElement('button'); b.className='tact'; b.textContent=txt; b.title=title;
  b.onclick=(ev)=>{ ev.stopPropagation(); ev.preventDefault(); fn(ev); };
  return b;
}
function esc(s){ return String(s).split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;'); }
function markSel(){
  document.querySelectorAll('#rtree .tdir>summary').forEach(s2=>s2.classList.toggle('sel',s2.dataset.dir===selDir));
  const h=$('cur-head'); if(!h||!curWs) return;
  const segs=selDir?selDir.split('/'):[];
  let html='<button class="bcb" id="bc-up" title="回到上一级文件夹"'+(segs.length?'':' disabled')+'>⬆</button>'+
           '<button class="bcb" id="bc-root" title="回到工作区根目录"'+(segs.length?'':' disabled')+'>🏠</button>';
  html+='<span class="bseg'+(segs.length?'':' cur')+'" data-p="">'+esc(wsDisplayName({id:curWs,sid:sessionId}))+'</span>';
  let acc='';
  for(const s of segs){
    acc=acc?acc+'/'+s:s;
    html+='<span class="bsep">›</span><span class="bseg'+(acc===selDir?' cur':'')+'" data-p="'+esc(acc)+'">'+esc(s)+'</span>';
  }
  const abs=(window.__root||'')+'/data/artifacts/'+curWs+(selDir?'/'+selDir:'');
  html+='<div class="absline" title="'+esc(abs)+'">'+esc(abs)+'</div>';
  h.innerHTML=html;
  $('bc-up').onclick=()=>{ const p=selDir.split('/'); p.pop(); selDir=p.join('/'); markSel(); };
  $('bc-root').onclick=()=>{ selDir=''; markSel(); };
  h.querySelectorAll('.bseg').forEach(el=>el.onclick=()=>{ selDir=el.dataset.p; markSel(); });
}
function dirOrFileNode(n,depth){
  if(n.type==='file') return fileNode(n,depth);
  const det=document.createElement('details'); det.className='tdir'; det.open=depth<1||selDir===n.path||(selDir&&selDir.startsWith(n.path+'/'));
  det.style.marginLeft=(depth?14:0)+'px';
  const sum=document.createElement('summary'); sum.dataset.dir=n.type==='dir'?n.path:'';
  sum.innerHTML='<span>'+(n.type==='link'?'🔗':'📁')+'</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+n.name+'</span>'+
    (n.type==='link'?'<span class="bdg link" title="'+String(n.target||'').replace(/"/g,'&quot;')+'">链接</span>':'');
  sum.addEventListener('click',()=>{ if(n.type==='dir'){ selDir=n.path; markSel(); } });
  if(n.type==='dir'){
    // 目录级快捷创建：文件管理的基本语义——在哪个文件夹上操作就建在哪
    sum.appendChild(tactBtn('＋📄','在这个文件夹里新建文件',async()=>{
      const nm=prompt('新文件叫什么名字？'); if(!nm) return;
      const r=await fetch('/api/fs/new',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ws:curWs,path:n.path+'/'+nm,type:'file'})});
      const d=await r.json(); d.ok?(selDir=n.path,renderCurPane()):alert('创建失败: '+(d.err||''));
    }));
    sum.appendChild(tactBtn('＋📁','在这个文件夹里新建子文件夹',async()=>{
      const nm=prompt('新文件夹叫什么名字？'); if(!nm) return;
      const r=await fetch('/api/fs/new',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ws:curWs,path:n.path+'/'+nm,type:'dir'})});
      const d=await r.json(); d.ok?(selDir=n.path,renderCurPane()):alert('创建失败: '+(d.err||''));
    }));
    sum.appendChild(tactBtn('✎','重命名这个文件夹',async()=>{
      const nn=prompt('改成什么名字？',n.name); if(!nn||nn===n.name) return;
      const r=await fetch('/api/fs/rename',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ws:curWs,path:n.path,name:nn})});
      const d=await r.json(); if(d.ok){ if(selDir===n.path) selDir=d.path; renderCurPane(); } else alert('改名失败: '+(d.err||''));
    }));
    sum.appendChild(tactBtn('🗑','删除这个文件夹（连同里面所有内容）',async()=>{
      if(!confirm('删除文件夹「'+n.name+'」？里面的文件也会一起删掉。')) return;
      const r=await fetch('/api/fs/delete',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ws:curWs,path:n.path})});
      const d=await r.json(); if(d.ok){ if(selDir===n.path||selDir.startsWith(n.path+'/')) selDir=''; renderCurPane(); } else alert('删除失败: '+(d.err||''));
    }));
  }
  if(n.type==='link'){
    const un=tactBtn('✕','取消引入（只移除链接，不动原文件）',async()=>{
      if(!confirm('取消引入「'+n.name+'」？只移除这个链接，原工作区和文件都不动。')) return;
      const r=await fetch('/api/ws/unlink',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ws:curWs,path:n.path})});
      const d=await r.json(); d.ok?renderCurPane():alert('失败: '+(d.err||''));
    });
    sum.appendChild(un);
  }
  det.appendChild(sum);
  for(const c of (n.children||[])) det.appendChild(dirOrFileNode(c,depth+1));
  return det;
}
function fileNode(n,depth){
  const el=document.createElement('div'); el.className='tnode'; el.style.paddingLeft=(4+depth*14)+'px';
  el.title=n.path+'（点击预览）';
  el.innerHTML='<span>'+fileIcon(n.name)+'</span><span class="nm">'+n.name+'</span>'+
    (n.att?'<span class="bdg">附件</span>':'')+'<span class="sz">'+fmtSize(n.size||0)+'</span>';
  el.onclick=()=>window.open('/preview/'+encodeURIComponent(curWs+'/'+n.path),'_blank');
  el.appendChild(tactBtn('↗','用电脑里的办公软件打开',async()=>{
    try{ const r=await fetch('/open/'+encodeURIComponent(curWs+'/'+n.path)); const d=await r.json(); d.ok?note('已在电脑上打开 '+n.name):alert('打不开: '+(d.err||'')); }catch(e){ alert('打不开: '+e.message); }
  }));
  el.appendChild(tactBtn('🕘','历史版本',(ev)=>toggleVersions({name:n.path,size:n.size},el)));
  el.appendChild(tactBtn('✎','重命名',async()=>{
    const nn=prompt('改成什么名字？',n.name); if(!nn||nn===n.name) return;
    const r=await fetch('/api/fs/rename',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ws:curWs,path:n.path,name:nn})});
    const d=await r.json(); d.ok?renderCurPane():alert('改名失败: '+(d.err||''));
  }));
  el.appendChild(tactBtn('🗑','删除',async()=>{
    if(!confirm('删除「'+n.name+'」？'+(n.att?'':'\n（删之前会自动存一版，可在历史版本里找回）'))) return;
    const r=await fetch('/api/fs/delete',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ws:curWs,path:n.path})});
    const d=await r.json(); d.ok?renderCurPane():alert('删除失败: '+(d.err||''));
  }));
  return el;
}

// ===== 浏览全部 pane =====
function renderChips(){
  const defs=[['all','全部'],['active','活跃'],['orphan','未关联'],['archived','已归档']];
  const box=$('all-chips'); box.innerHTML='';
  for(const [k,label] of defs){
    const b=document.createElement('button'); b.className='chip'+(allFilter.chip===k?' on':''); b.textContent=label;
    b.onclick=()=>{ allFilter.chip=k; allFilter.page=1; renderChips(); renderAllPane(); };
    box.appendChild(b);
  }
}
function filteredWs(){
  let list=wsList.filter(w=>{
    if(allFilter.chip==='active'&&!(w.state==='active'||w.sid===sessionId)) return false;
    if(allFilter.chip==='orphan'&&w.state!=='orphan') return false;
    if(allFilter.chip==='archived'&&w.state!=='archived') return false;
    if(allFilter.q){ const hay=(w.id+' '+(sessionTitle(w.sid)||'')).toLowerCase(); if(!hay.includes(allFilter.q.toLowerCase())) return false; }
    return true;
  });
  const k=allFilter.sort;
  list.sort((a,b)=> k==='name'? a.id.localeCompare(b.id,'zh') : k==='bytes'? b.bytes-a.bytes : b.mtime-a.mtime);
  return list;
}
function renderAllPane(){
  if(!$('pane-all')||$('pane-all').style.display==='none'){ /* 数据先备着 */ }
  const list=filteredWs();
  const pages=Math.max(1,Math.ceil(list.length/PAGE_N));
  if(allFilter.page>pages) allFilter.page=pages;
  const slice=list.slice((allFilter.page-1)*PAGE_N, allFilter.page*PAGE_N);
  const box=$('all-list'); box.innerHTML='';
  if(allFilter.chip==='active'&&wsList.some(w=>w.state!=='active')){
    const tip=document.createElement('div'); tip.className='fnote'; tip.style.cssText='padding:2px 12px 8px';
    tip.textContent='归档对话和未关联的工作区在上方状态片里查看；未关联的可以删除。';
    box.appendChild(tip);
  }
  if(!slice.length){ box.innerHTML='<div class="fnote" style="padding:10px">没有符合条件的工作区。</div>'; }
  for(const w of slice){
    const row=document.createElement('div'); row.className='wrow';
    row.innerHTML='<div class="t1"><span>'+(w.state==='archived'?'🗂':'📁')+'</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(wsDisplayName(w))+'</span><span class="bdg">'+wsStateLabel(w)+'</span></div>'+
      '<div class="t2">'+esc(w.id)+' · '+w.files+' 个文件 · '+fmtSize(w.bytes)+' · 最近 '+(w.mtime?new Date(w.mtime).toLocaleString('zh',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'—')+'</div>';
    const intro=document.createElement('button');
    if(!curWs||w.id===curWs){ intro.disabled=true; intro.textContent=w.id===curWs?'就是本对话':'引入'; }
    else{
      intro.textContent='📥 引入到本对话';
      intro.onclick=()=>{
        // 行内命名表单：默认名=工作区id，可直接改
        row.querySelectorAll('button').forEach(b=>b.style.display='none');
        const form=document.createElement('span'); form.style.cssText='display:inline-flex;gap:5px;align-items:center';
        const inp=document.createElement('input'); inp.value=w.id; inp.style.cssText='flex:1;padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:12px';
        const ok=document.createElement('button'); ok.textContent='确定'; ok.style.background='var(--g)'; ok.style.color='#fff'; ok.style.borderColor='var(--g)';
        const cc=document.createElement('button'); cc.textContent='取消';
        ok.onclick=async()=>{
          const label=inp.value.trim(); if(!label) return;
          const r=await fetch('/api/ws/link',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ws:curWs,target:w.id,label})});
          const d=await r.json();
          if(d.ok){ showTab('cur'); renderCurPane(); addInfo('已把「'+wsDisplayName(w)+'」以链接方式引进本对话，里面的文件都能 @ 引用了。'); }
          else { alert('引入失败: '+(d.err||'')); row.querySelectorAll('button').forEach(b=>b.style.display=''); form.remove(); }
        };
        cc.onclick=()=>{ form.remove(); row.querySelectorAll('button').forEach(b=>b.style.display=''); };
        form.appendChild(inp); form.appendChild(ok); form.appendChild(cc);
        row.appendChild(form); inp.focus();
      };
    }
    row.appendChild(intro);
    if(w.state!=='active'){
      const del=document.createElement('button'); del.className='danger'; del.textContent='🗑 删除工作区';
      del.onclick=async()=>{
        if(!confirm('彻底删除工作区「'+w.id+'」连同里面全部文件？这一步真的找不回来了。')) return;
        if(!confirm('最后确认：连文件带版本历史一起删，确定？')) return;
        const r=await fetch('/api/ws/delete',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ws:w.id})});
        const d=await r.json();
        if(d.ok){ loadWorkspaces(); note('工作区已删除'); } else alert('删除失败: '+(d.err||''));
      };
      row.appendChild(del);
    }
    box.appendChild(row);
  }
  const pager=$('all-pager'); pager.innerHTML='';
  if(pages>1){
    const prev=document.createElement('button'); prev.className='mini'; prev.textContent='‹ 上一页'; prev.disabled=allFilter.page<=1;
    prev.onclick=()=>{ allFilter.page--; renderAllPane(); };
    const nx=document.createElement('button'); nx.className='mini'; nx.textContent='下一页 ›'; nx.disabled=allFilter.page>=pages;
    nx.onclick=()=>{ allFilter.page++; renderAllPane(); };
    pager.appendChild(prev); pager.appendChild(document.createTextNode(' '+allFilter.page+' / '+pages+' ')); pager.appendChild(nx);
  }
}
function showTab(which){
  $('tabbtn-cur').classList.toggle('on',which==='cur');
  $('tabbtn-all').classList.toggle('on',which==='all');
  $('pane-cur').style.display=which==='cur'?'flex':'none';
  $('pane-all').style.display=which==='all'?'flex':'none';
  if(which==='cur') renderCurPane(); else { renderChips(); renderAllPane(); }
}
$('tabbtn-cur').onclick=()=>showTab('cur');
$('tabbtn-all').onclick=()=>{ showTab('all'); loadWorkspaces(); };
$('ws-refresh').onclick=()=>{ loadWorkspaces(); renderCurPane(); loadArch().then(loadSessions); };
$('att-only').onchange=()=>renderCurPane();
$('nf-btn').onclick=async()=>{ const nm=prompt('新文件叫什么名字？（放进当前选中的文件夹：'+(selDir||'根目录')+'）'); if(!nm) return;
  const r=await fetch('/api/fs/new',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ws:curWs,path:(selDir?selDir+'/':'')+nm,type:'file'})});
  const d=await r.json(); d.ok?renderCurPane():alert('创建失败: '+(d.err||'')); };
$('nd-btn').onclick=async()=>{ const nm=prompt('新文件夹叫什么名字？（放在 '+(selDir||'根目录')+' 下）'); if(!nm) return;
  const r=await fetch('/api/fs/new',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ws:curWs,path:(selDir?selDir+'/':'')+nm,type:'dir'})});
  const d=await r.json(); d.ok?(selDir=selDir?selDir+'/'+nm:nm,renderCurPane()):alert('创建失败: '+(d.err||'')); };
// ---- 版本时间线：点 🕘 展开该文件的历史版本，可预览/一键恢复 ----
$('rside-toggle').onclick=()=>{ $('rside').classList.toggle('open'); renderCurPane(); loadWorkspaces(); };
// ---- 版本时间线：点 🕘 展开该文件的历史版本，可预览/一键恢复 ----
async function toggleVersions(f, rowEl){
  const old=rowEl.nextElementSibling;
  if(old&&old.classList&&old.classList.contains('vlist')){ old.remove(); return; }
  const box=document.createElement('div'); box.className='vlist';
  box.innerHTML='<div class="fnote" style="padding:2px">读取历史…</div>';
  rowEl.parentNode.insertBefore(box, rowEl.nextSibling);
  try{
    const r=await fetch('/api/vcs/log?ws='+encodeURIComponent(curWs||'')+'&file='+encodeURIComponent(f.name));
    const d=await r.json();
    if(!d.ok||!d.versions.length){ box.innerHTML='<div class="fnote" style="padding:2px">还没有历史版本——改动过一次后这里就有了</div>'; return; }
    box.innerHTML='';
    for(const v of d.versions){
      const it=document.createElement('div'); it.className='vitem';
      it.innerHTML='<span class="vt">'+v.time+'</span><span class="vm" title="'+(v.msg||'').replace(/"/g,'&quot;')+'">'+(v.msg||'(无说明)')+'</span>';
      const pv=document.createElement('button'); pv.textContent='看'; pv.title='预览这一版';
      pv.onclick=()=>window.open('/api/vcs/blob?ws='+encodeURIComponent(curWs||'')+'&file='+encodeURIComponent(f.name)+'&oid='+v.oid,'_blank');
      const rs=document.createElement('button'); rs.textContent='恢复'; rs.title='把这个文件变回这一版（当前版会先自动存一版）';
      rs.onclick=async()=>{
        if(!confirm('把「'+f.name.split('/').pop()+'」恢复到 '+v.time+' 那一版？')) return;
        rs.disabled=true; rs.textContent='恢复中…';
        try{
          const rr=await fetch('/api/vcs/restore',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ws:curWs,file:f.name,oid:v.oid})});
          const dd=await rr.json();
          if(dd.ok){ addInfo('已把「'+f.name.split('/').pop()+'」恢复到上一版。'); renderCurPane(); }
          else { alert('恢复失败: '+(dd.err||'未知')); rs.disabled=false; rs.textContent='恢复'; }
        }catch(e){ alert('恢复失败: '+e.message); rs.disabled=false; rs.textContent='恢复'; }
      };
      it.appendChild(pv); it.appendChild(rs);
      box.appendChild(it);
    }
  }catch(e){ box.innerHTML='<div class="fnote" style="padding:2px">读取失败</div>'; }
}
$('rside-close').onclick=()=>$('rside').classList.remove('open');
$('up-btn2').onclick=()=>$('up-input').click();
$('link-btn').onclick=()=>{ const r=$('link-row'); r.style.display=r.style.display==='none'?'block':'none'; };
$('link-ok').onclick=()=>{
  const p=$('link-path').value.trim(); if(!p)return;
  if(!curWs){ note('工作区还没准备好，几秒后再试'); return; }
  fetch('/api/link?ws='+encodeURIComponent(curWs)+'&target='+encodeURIComponent(p)+'&label='+encodeURIComponent(p.split('\\').pop().split('/').pop()))
    .then(r=>r.json()).then(d=>{
      if(d.ok){ renderCurPane(); $('link-row').style.display='none'; addInfo('已把文件夹「'+d.name+'」接进本对话的工作区，里面的文件都能 @ 引用了。'); }
      else note('链接失败: '+(d.err||'未知原因'));
    })
    .catch(()=>note('链接失败：服务没响应'));
};
$('up-input').onchange=async()=>{
  if(!curWs){ note('工作区还没准备好，几秒后再试'); return; }
  const names=[];
  for(const f of $('up-input').files){
    try{
      const buf=await f.arrayBuffer();
      const r=await fetch('/api/upload?ws='+encodeURIComponent(curWs)+'&dir='+encodeURIComponent(selDir||'')+'&name='+encodeURIComponent(f.name),{method:'POST',body:buf});
      const d=await r.json(); if(d.ok) names.push(d.name);
    }catch(e){}
  }
  $('up-input').value='';
  renderCurPane();
  if(names.length){ addInfo('已收到 '+names.length+' 个文件，放在「'+(selDir||'根目录')+'」里。想让我处理它，就在消息里 @ 它的文件名。'); }
  else note('上传失败，请重试');
};
// 拖拽上传（落点=选中的文件夹）
document.addEventListener('dragover',e=>{e.preventDefault();});
document.addEventListener('drop',async e=>{
  e.preventDefault();
  if(!curWs){ addErr('工作区还没准备好，等状态灯变绿再拖文件进来。'); return; }
  const names=[];
  for(const f of (e.dataTransfer||{}).files||[]){
    try{
      const buf=await f.arrayBuffer();
      const r=await fetch('/api/upload?ws='+encodeURIComponent(curWs)+'&dir='+encodeURIComponent(selDir||'')+'&name='+encodeURIComponent(f.name),{method:'POST',body:buf});
      const d=await r.json(); if(d.ok) names.push(d.name);
    }catch(err){}
  }
  if(names.length){ renderCurPane(); addInfo('收到 '+names.length+' 个文件（在「'+(selDir||'根目录')+'」）。消息里用 @ 引用即可让我处理。'); }
});
