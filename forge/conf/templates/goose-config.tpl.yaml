# 由启动器生成（__FORGE_ROOT__ 占位）——goose 不会展开 ${VAR}，必须写入绝对路径
GOOSE_PROVIDER: openai
# s99/S3（裁决 2026-09-21 §3.6）：出厂空态——GOOSE_MODEL 与 bootstrap 种子同步改空；桥路径 spawn env
# 恒注入真值（env 压 config），本键只是 env 缺位时的兜底（直接跑 goose CLI 的开发场景）。
GOOSE_MODEL: ''
GOOSE_MODE: smart_approve
# T1（裁决书 S-B）：hints 只认 .goosehints，不再吸入 AGENTS.md（dev 仓库工作契约/用户域文件泄漏面）
CONTEXT_FILE_NAMES: ['.goosehints']

extensions:
  faucet-db:
    type: stdio
    name: faucet-db
    enabled: true
    cmd: '__FORGE_ROOT__/bin/faucet/faucet.exe'
    args: ['mcp', '--data-dir', '__FORGE_ROOT__/data/faucet']
    timeout: 300
  browser:
    type: stdio
    name: browser
    enabled: true
    cmd: '__NODE_DIR__/node.exe'
    args: ['__FORGE_ROOT__/bin/pw-mcp/node_modules/@playwright/mcp/cli.js', '--browser', 'msedge', '--user-data-dir', '__FORGE_ROOT__/data/pw-profile', '--allowed-origins', '*']
    timeout: 300
  chatrecall:
    type: platform
    name: chatrecall
    enabled: true
  memory:
    type: stdio
    name: memory
    enabled: true
    cmd: 'cmd'
    args: ['/c', '__FORGE_ROOT__/bin/memory-mcp.cmd']
    timeout: 120
  # s107/f4（裁决 2026-10-02-s107-report-permission-readtool）：只读文件内容工具。read_only_hint 注解
  # → smart_approve 判定链第②步确定性放行，报表 happy path 免卡读（上传即同意）。作用域恒限
  # data/artifacts/ 子树（conf/ 与 data/ 其它面有密钥，不进模型上下文）；机制不进配置面、无专用开关。
  read:
    type: stdio
    name: read
    enabled: true
    cmd: '__NODE_DIR__/node.exe'
    args: ['__FORGE_ROOT__/bin/read-file-mcp.js', '__FORGE_ROOT__/data/artifacts']
    timeout: 60
  # s108/d2（裁决 2026-10-03-s108-db-write-path 裁决一）：建数据库工具（db_create_service/db_create_table
  # 两把，全部 write 注解 readOnlyHint=false → smart_approve 注解归一确定性 ask_before——一次建库/一次建表
  # 各一张真同意卡，取代旧 shell 路径的 27 卡墙）。密钥（faucet .apikey）只在工具进程内读取，不进 agent 上下文；
  # pc restart 编排内置于 db_create_service（端口逐次读 data/pc.port 动态值），机制不进配置面、无专用开关。
  db-create:
    type: stdio
    name: db-create
    enabled: true
    cmd: '__NODE_DIR__/node.exe'
    args: ['__FORGE_ROOT__/bin/db-create-mcp.js', '__FORGE_ROOT__']
    timeout: 90
  # G3（裁决书 S-B）：关停无场景点名的平台扩展——已双臂探针实证（tmp/goose-probe/ext-probe.js）：
  # apps/summon/extensionmanager/analyze 共 11 把工具消失，其余扩展不受影响。
  # todo 保留（ACP plan 事件来源，P32 底座）。用户在设置面板改过开关的，bootstrap 重建时保留其值。
  apps:
    type: platform
    name: apps
    enabled: false
  summon:
    type: platform
    name: summon
    enabled: false
  extensionmanager:
    type: platform
    name: extensionmanager
    enabled: false
  analyze:
    type: platform
    name: analyze
    enabled: false
