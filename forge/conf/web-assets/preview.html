<!DOCTYPE html>
<html lang="zh">
<head><meta charset="utf-8"><title>预览</title>
<style>
body{font-family:"Microsoft YaHei",system-ui,sans-serif;margin:0;background:#f4f6f5}
#bar{background:#0b6b3a;color:#fff;padding:10px 18px;font-size:14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
#bar a{color:#cfe9db;font-size:13px}
#content{padding:22px;max-width:1080px;margin:0 auto;background:#fff;min-height:60vh;margin-bottom:22px;border-radius:0 0 12px 12px;overflow-x:auto}
table{border-collapse:collapse;margin:10px 0;font-size:13.5px}
th,td{border:1px solid #d5e2da;padding:5px 12px}
th{background:#eef5f0}
pre{background:#f6f8f6;border:1px solid #dde;border-radius:8px;padding:12px;overflow-x:auto}
img{max-width:100%}
#err{color:#b00020;padding:30px;text-align:center}
</style>
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/mammoth.browser.min.js"></script>

</head>
<body>
<div id="bar"><span id="fname"></span><a id="dl">⬇ 下载原文件</a></div>
<div id="content"><div id="hint">加载中…</div></div>
<script>
const name = decodeURIComponent(location.hash.slice(1));
const raw = location.pathname.split('/preview/')[1] || name;
const file = decodeURIComponent(raw);
document.getElementById('fname').textContent = file;
document.getElementById('dl').href = '/artifact/' + encodeURIComponent(file);
const content = document.getElementById('content');

async function main(){
  const ext = (file.match(/\.([a-z0-9]+)$/i)||[])[1]?.toLowerCase() || '';
  const res = await fetch('/artifact/' + encodeURIComponent(file));
  if (!res.ok){ content.innerHTML = '<div id="err">文件不存在或无法读取：' + file + '</div>'; return; }
  if (['png','jpg','jpeg','gif','webp','svg','bmp'].includes(ext)){
    content.innerHTML = '<img src="/artifact/' + encodeURIComponent(file) + '">';
  } else if (ext === 'pdf'){
    window.location.href = '/artifact/' + encodeURIComponent(file); // 浏览器原生 PDF
  } else if (ext === 'md' || ext === 'markdown' || ext === 'txt' || ext === 'log'){
    const text = await res.text();
    if (ext === 'md' || ext === 'markdown') content.innerHTML = marked.parse(text);
    else content.innerHTML = '<pre>' + text.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</pre>';
  } else if (ext === 'html' || ext === 'htm'){
    const text = await res.text();
    const iframe = document.createElement('iframe');
    iframe.style.cssText = 'width:100%;height:70vh;border:1px solid #dde;border-radius:8px';
    iframe.srcdoc = text;
    content.innerHTML = ''; content.appendChild(iframe);
  } else if (ext === 'docx'){
    const buf = await res.arrayBuffer();
    const r = await mammoth.convertToHtml({ arrayBuffer: buf });
    content.innerHTML = r.value || '(空文档)';
  } else if (['xlsx','xls','csv'].includes(ext)){
    const XLSXlib = (typeof XLSX !== 'undefined' && XLSX) || window.XLSX || window['xlsx'] || globalThis.XLSX;
    if (!XLSXlib) throw new Error('xlsx 库未加载; window keys=' + Object.keys(window).filter(function(k){return k.toLowerCase().indexOf('xls')>=0||k==='marked'||k.toLowerCase().indexOf('mammoth')>=0;}).join(',') + '; readyState=' + document.readyState);
    const buf = await res.arrayBuffer();
    const wb = XLSXlib.read(buf, { type: 'array' });
    let html = '';
    for (const sheetName of wb.SheetNames){
      if (wb.SheetNames.length > 1) html += '<h3 style="color:#0b6b3a">' + sheetName + '</h3>';
      html += XLSXlib.utils.sheet_to_html(wb.Sheets[sheetName]);
    }
    content.innerHTML = html;
  } else if (['json'].includes(ext)){
    const j = await res.json();
    content.innerHTML = '<pre>' + JSON.stringify(j, null, 2).replace(/</g,'&lt;') + '</pre>';
  } else {
    content.innerHTML = '<div id="hint">这类文件（.' + ext + '）不支持预览，<a href="/artifact/' + encodeURIComponent(file) + '">点此下载</a>查看。</div>';
  }
}
function loadScript(src){
  return new Promise(function(ok, no){ var sc = document.createElement('script'); sc.src = src; sc.onload = ok; sc.onerror = function(){ no(new Error('脚本加载失败: ' + src)); }; document.head.appendChild(sc); });
}
// xlsx UMD 在部分宿主被 module.exports 分支吃掉：双保险加载后若 window.XLSX 缺失，用 module 垫片再取
function loadXlsxShim(){
  if (window.XLSX) return Promise.resolve();
  return loadScript('/vendor/xlsx.full.min.js?shim=1').then(function(){
    if (window.XLSX) return;
    return new Promise(function(res){
      var m = { exports: {} };
      window.__xlsxModule = m;
      fetch('/vendor/xlsx.full.min.js').then(function(r){ return r.text(); }).then(function(code){
        try { new Function('module','exports', code)(m, m.exports); window.XLSX = m.exports; } catch(e){}
        res();
      });
    });
  });
}
window.addEventListener('load', function(){ setTimeout(function(){ loadXlsxShim().catch(function(e){ console.warn(e.message); }).then(function(){ return main(); }).catch(function(e){ content.innerHTML = '<div id="err">预览失败：' + e.message + '</div>'; }); }, 60); });
</script>
</body></html>
