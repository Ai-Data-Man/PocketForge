# forge-meta: {"description":"<一句中文人话说清这个应用给谁做什么>","url":"<有网页入口就填 http://127.0.0.1:端口，没有就删掉这项>","created_at":"<YYYY-MM-DD>","source":"<本对话工作区目录名>"}
# 应用注册模板（Agent 复制本文件到 apps/<name>.yaml 并填写）
# 规则（ADR-0003）：
#   1. 顶层只写 processes:，进程键名必须以应用名开头（如 myapp-web）。
#   2. 禁止定义基础设施键（nats/faucet/goose-*）。
#   3. 数据落 data/，日志走 pc 统一 rotation。
#   4. 注册后执行: pc project update -f conf/process-compose.yaml -f apps/<name>.yaml
#   5. 值一律用单引号（s88/R2 实锤：${FORGE_ROOT} 替换出的反斜杠路径在双引号里被当转义符，pc 解析即 FTL）。
processes:
  myapp-<proc>:
    command: '<可执行文件或脚本，绝对路径用 ${FORGE_ROOT}>'
    working_dir: '${FORGE_ROOT}'
    is_daemon: true
    availability:
      restart: on_failure
      max_restarts: 3     # s92：必须有上限——坏应用无上限重启会持续烧 CPU（QA 实测 3 分钟 restarts=31）
      backoff_seconds: 5
    readiness_probe: # 二选一
      http_get: { host: 127.0.0.1, port: 0, scheme: http, path: / }
      # exec: { command: 'cmd /c exit 0' }
    log_location: '${FORGE_ROOT}/data/logs/myapp-<proc>.log'
